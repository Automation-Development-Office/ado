# Development and CI Galaxy server order. Certified (Automation Hub) is searched
# before public Galaxy so Hub-only transitive deps (e.g. ansible.platform from
# infra.aap_configuration) resolve during ade install / ansible-galaxy.
#
# Token: set AUTOMATION_HUB_TOKEN or ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN, then
# run scripts/ci/setup-automation-hub.sh (or source it) to write .ansible/automation_hub_token.
# tox-ansible forwards the env vars listed in tox-ansible.ini pass_env.
[galaxy]
server_list = certified,galaxy

[galaxy_server.certified]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
token_path = .ansible/automation_hub_token

[galaxy_server.galaxy]
url = https://galaxy.ansible.com/
