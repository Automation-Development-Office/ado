---
namespace: "infra"
name: "ado"
version: 1.3.16
readme: README.md
authors:
  - Automation Development Office

description: >-
  Automation Development Office roles for AAP, OpenShift, RHEL, Satellite,
  IdM, RHBK, and platform bootstrap workflows.
license_file: LICENSE

tags:
  - aap
  - automation
  - bootstrap
  - idm
  - openshift
  - rhel
  - satellite
# amazon.aws is required by infra.ado.ec2_ami_copy (AnsibleAWSModule / doc
# fragments). Other runtime collections remain EE/container-bundled so offline
# artifact installs are not forced to resolve them from Galaxy.
dependencies:
  amazon.aws: ">=8.0.0"
  community.grafana: ">=1.5.0"
  # AAP install (install_aap) and ACS policy upload (acs_upload_policies).
  # Virt ops is Hub/git-only — not declared here so offline Galaxy installs
  # of infra.ado still resolve.
  infra.aap_utilities: ">=3.5.0"
  infra.rhacs_configuration: ">=2.0.0"

repository: https://github.com/automation-development-office/ado
documentation: >-
  https://github.com/automation-development-office/ado/blob/main/README.md
homepage: https://github.com/automation-development-office/ado
issues: https://github.com/automation-development-office/ado/issues

# File glob-like patterns to filter from the built collection artifact.
build_ignore:
  - .gitignore
  - .ansible
  - .ansible/*
  - '*/.ansible'
  - '*/.ansible/*'
  - '**/.ansible'
  - '**/.ansible/**'
  - .ansible-tmp
  - .ansible-tmp/**
  - .cache
  - .cache/**
  - .kube
  - .kube/**
  - .local
  - .local/**
  - '**/__pycache__'
  - '**/__pycache__/**'
  - '*.pyc'
  - .kube
  - .kube/**
  - .tox
  - .tox/**
  - changelogs/.plugin-cache.yaml
  - .venv
  - collections
