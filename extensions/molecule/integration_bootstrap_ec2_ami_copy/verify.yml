---
- name: Verify ec2_ami_copy bootstrap content
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    env: molecule

  tasks:
    - name: Verify generated playbook exists
      ansible.builtin.stat:
        path: >-
          {{ playbook_dir }}/playbooks/aws/ado-copy-ami-bootstrap.yml
      register: ec2_ami_copy_playbook

    - name: Assert ec2_ami_copy playbook was generated
      ansible.builtin.assert:
        that:
          - ec2_ami_copy_playbook.stat.exists
          - ec2_ami_copy_playbook.stat.isreg
        fail_msg: >-
          Expected playbooks/aws/ado-copy-ami-bootstrap.yml to be generated

    - name: Verify generated job template exists
      ansible.builtin.stat:
        path: >-
          {{ playbook_dir }}/configs/job_templates/ado-copy-ami-bootstrap.jt.yml
      register: ec2_ami_copy_job_template

    - name: Assert ec2_ami_copy job template was generated
      ansible.builtin.assert:
        that:
          - ec2_ami_copy_job_template.stat.exists
          - ec2_ami_copy_job_template.stat.isreg
        fail_msg: >-
          Expected configs/job_templates/ado-copy-ami-bootstrap.jt.yml

    - name: Verify generated component vars file exists
      ansible.builtin.stat:
        path: >-
          {{ playbook_dir }}/group_vars/all/{{ env }}/vars_ec2_ami_copy.yml
      register: ec2_ami_copy_vars_file

    - name: Assert ec2_ami_copy vars file was generated
      ansible.builtin.assert:
        that:
          - ec2_ami_copy_vars_file.stat.exists
          - ec2_ami_copy_vars_file.stat.isreg
        fail_msg: Expected group_vars/all/{{ env }}/vars_ec2_ami_copy.yml

    - name: Verify generated shared AWS vars file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/group_vars/all/{{ env }}/vars_aws.yml"
      register: aws_vars_file

    - name: Assert shared AWS vars file was generated
      ansible.builtin.assert:
        that:
          - aws_vars_file.stat.exists
          - aws_vars_file.stat.isreg
        fail_msg: Expected group_vars/all/{{ env }}/vars_aws.yml

    - name: Verify generated shared AWS vault file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/group_vars/all/{{ env }}/vault_aws.yml"
      register: aws_vault_file

    - name: Assert shared AWS vault file was generated
      ansible.builtin.assert:
        that:
          - aws_vault_file.stat.exists
          - aws_vault_file.stat.isreg
        fail_msg: Expected group_vars/all/{{ env }}/vault_aws.yml

    - name: Verify ec2_ami_copy component vault file was not generated
      ansible.builtin.stat:
        path: >-
          {{ playbook_dir }}/group_vars/all/{{ env }}/vault_ec2_ami_copy.yml
      register: ec2_ami_copy_vault_file

    - name: Assert ec2_ami_copy uses shared AWS vault only
      ansible.builtin.assert:
        that:
          - not ec2_ami_copy_vault_file.stat.exists
        fail_msg: >-
          vault_ec2_ami_copy.yml should not be generated; use vault_aws.yml

    - name: Load generated vars for ec2_ami_copy
      ansible.builtin.slurp:
        src: "{{ ec2_ami_copy_vars_file.stat.path }}"
      register: ec2_ami_copy_vars_raw

    - name: Parse generated vars for ec2_ami_copy
      ansible.builtin.set_fact:
        ec2_ami_copy_generated_vars: >-
          {{ ec2_ami_copy_vars_raw.content | b64decode | from_yaml }}

    - name: Assert generated vars contain expected ec2_ami_copy defaults
      ansible.builtin.assert:
        that:
          - >-
            ec2_ami_copy_generated_vars.ec2_ami_copy_source_region
            == 'us-east-1'
          - >-
            ec2_ami_copy_generated_vars.ec2_ami_copy_dest_region == 'us-west-2'
          - >-
            ec2_ami_copy_generated_vars.ec2_ami_copy_source_image_id
            == 'ami-0123456789abcdef0'
          - >-
            ec2_ami_copy_generated_vars.ec2_ami_copy_name
            == 'molecule-copied-ami'
        fail_msg: Generated vars_ec2_ami_copy.yml did not match preflight config

    - name: Load generated shared AWS vault for awspca bridge check
      ansible.builtin.slurp:
        src: "{{ aws_vault_file.stat.path }}"
      register: aws_vault_raw

    - name: Parse generated shared AWS vault
      ansible.builtin.set_fact:
        aws_vault_data: "{{ aws_vault_raw.content | b64decode | from_yaml }}"

    - name: Simulate awspca playbook credential bridge from vault_aws
      ansible.builtin.set_fact:
        ocp_awspca_access_key_id: >-
          {{
            aws_vault_data.vault_aws_access_key_id
            | default(ocp_awspca_access_key_id | default(''))
          }}
        ocp_awspca_secret_access_key: >-
          {{
            aws_vault_data.vault_aws_secret_access_key
            | default(ocp_awspca_secret_access_key | default(''))
          }}

    - name: Assert awspca playbook can resolve creds from vault_aws
      ansible.builtin.assert:
        that:
          - >-
            aws_vault_data.vault_aws_access_key_id
            == 'MOLECULE_AWS_ACCESS_KEY_ID'
          - >-
            aws_vault_data.vault_aws_secret_access_key
            == 'MOLECULE_AWS_SECRET_ACCESS_KEY'
          - >-
            ocp_awspca_access_key_id == 'MOLECULE_AWS_ACCESS_KEY_ID'
          - >-
            ocp_awspca_secret_access_key == 'MOLECULE_AWS_SECRET_ACCESS_KEY'
        fail_msg: >-
          vault_aws.yml must feed the awspca bootstrap playbook bridge
          (vault_aws_* -> ocp_awspca_*).

    - name: Simulate legacy awspca creds loaded from vault_cert_manager
      ansible.builtin.set_fact:
        legacy_vault_aws_access_key_id: ""
        legacy_vault_aws_secret_access_key: ""
        legacy_ocp_awspca_access_key_id: LEGACY_PCA_ACCESS_KEY_ID
        legacy_ocp_awspca_secret_access_key: LEGACY_PCA_SECRET_ACCESS_KEY

    - name: Assert legacy awspca creds remain when vault_aws is empty
      ansible.builtin.assert:
        that:
          - legacy_vault_aws_access_key_id | default('') | length == 0
          - legacy_vault_aws_secret_access_key | default('') | length == 0
          - legacy_ocp_awspca_access_key_id == 'LEGACY_PCA_ACCESS_KEY_ID'
          - legacy_ocp_awspca_secret_access_key == 'LEGACY_PCA_SECRET_ACCESS_KEY'
        fail_msg: >-
          Existing vault_cert_manager ocp_awspca_* values must keep working
          when vault_aws.yml is empty (pre-task is skipped).

    - name: Validate job template references generated playbook
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import re
        import sys

        root = Path("{{ playbook_dir }}")
        jt = (
            root
            / "configs"
            / "job_templates"
            / "ado-copy-ami-bootstrap.jt.yml"
        )
        text = jt.read_text()
        match = re.search(
            r'(?m)^\s*playbook:\s*[\'"]?([^\'"\n]+)[\'"]?\s*$',
            text,
        )
        if not match:
            print("missing playbook field in job template")
            sys.exit(1)
        playbook = match.group(1).strip()
        if not (root / playbook).exists():
            print(f"missing playbook referenced by JT: {playbook}")
            sys.exit(1)
        print(f"job template references {playbook}")
        PY
      args:
        executable: /bin/bash
      changed_when: false
