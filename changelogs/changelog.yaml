      - 'bootstrap_generate_env_vars - Stage a selected RHBK standalone zip into

        ``files/`` and set ``rhbk_standalone_zip`` to the playbook-relative path

        so AAP can copy it from the controller/EE.

        '
      - "bootstrap_generate_env_vars - When preflight Galaxy setup is enabled, emit
        Galaxy/Hub API Token and Container Registry credentials (and org ``galaxy_credentials``
        attach) using General Contoller admin/OAuth fallbacks when tokens are empty
        \u2014 same pattern as Hub EE push."
      - bootstrap_generate_env_vars / preflight - Pass hostname, vaulted RHN password,
        optional subscription id, and admin credentials through to license activation.
      - bootstrap_generate_playbook_repo - AD trust bootstrap playbook loads ``vars_idm.yml``/``vault_idm.yml``
        and targets the IdM inventory.
      - bootstrap_generate_playbook_repo - Add Satellite Keycloak OIDC bootstrap playbook.
      - bootstrap_generate_playbook_repo - Added ``community.grafana`` and ``grafana.grafana``
        to generated collection requirements.
      - bootstrap_generate_playbook_repo - Default generated ``collections/requirements.yml``
        pin for ``infra.ado`` is ``1.0.3``.
      - 'bootstrap_generate_playbook_repo - Seed Grafana dashboard templates under

        ``playbook_repo_seed/templates/`` for copy-out: Openshift ``*.json.j2``

        dashboards and the RHACS vulnerability overview sample

        (``templates/RHACS/dashboards/rhacs-vulnerability-overview.json``).

        '
      - bootstrap_generate_playbook_repo / bootstrap_controller - Wire BookStack playbook
        and JT seed; selectable as ``bookstack`` OpenShift app.
      - bootstrap_resolve_component - Register ``bookstack`` component defaults.
      - bootstrap_resolve_component / preflight - Default ``grafana_folders`` now
        points at ``templates/Openshift`` and ``templates/RHACS``.
      - capsule_install - Added RHSM subscription tasks to register Capsule hosts
        with Satellite and enable required repositories.
      - capsule_install - Added ``capsule_install_setup_insights`` (default ``false``)
        to control Insights setup during Capsule registration.
      - capsule_install - Added skeleton role structure for Red Hat Satellite Capsule
        installation.
      - capsule_install - Updated role defaults and main task flow to support preliminary
        check and RHSM registration.
      - 'ci - Start fakecloud in the Molecule pipeline for scenarios listed in

        ``extensions/molecule/fakecloud_scenarios.txt`` so AWS API integration

        tests (``integration_ec2_ami_copy`` and

        ``integration_ec2_ami_copy_keep_name`` for ``infra.ado.ec2_ami_copy``)

        run without real cloud credentials.

        '
      - collections - Declare ``redhat.rhel_idm`` in collection requirements and playbook
        repo seed/template so IdM server/client/replica jobs can install the certified
        collection from Automation Hub.
      - docs - Expanded Hub recovery/permanence runbook for shared-Postgres LWLock
        failures.
      - idm_ad_trust - Replaced ``ipa`` CLI / ``ansible.builtin`` shell wrappers with
        ``redhat.rhel_idm`` modules (``ipatrust``, ``ipadnsforwardzone``, ``ipaidrange``,
        ``ipagroup``, ``ipasudorule``). Service start/restart (smb, named, sssd) now
        uses ``infra.ado.rhel_services_management``. OS-level steps (packages, firewalld,
        crypto policy, ``ipa-adtrust-install``) remain builtin where no collection
        role exists.
      - infra.ado - Preflight/bootstrap support for Grafana multi-folder git sources
        (json vs json.j2), alerts upload, ACS policies-from-git, RHBK multi-client
        + LDAP federation/mapper wiring, AAP license manifest/RHN activation, banner
        survey fields, and htpasswd add/replace/remove.
      - 'infra.ado.ec2_ami_copy - Added ``integration_ec2_ami_copy_keep_name``

        Molecule scenario to exercise copies that omit ``name``.

        '
      - 'infra.ado.ec2_ami_copy - ``name`` is optional; omit it to reuse the source

        AMI name, or set it to rename the copied AMI in the destination region.

        '
      - infra.ado.idm_ad_trust - New role and playbook to establish two-way IdM/AD
        trust, DNS forward zone, ID range fixes, and AD external group mapping for
        SSH/sudo.
      - infra.ado.idm_ad_trust - Run ``ipa-adtrust-install``, ensure SMB, open ``freeipa-trust``
        firewall, disable DNSSEC validation for AD forward zones, re-kinit after AD
        trust install, and support one-way or two-way trusts.
      - infra.ado.idm_ad_trust - Update default AD forest targets to ``ad.lab`` /
        ``adwindows.ad.lab`` / ``192.168.0.61``.
      - infra.ado.ocp_aap_hub_harden - New role to pin Hub to single replicas, single
        gunicorn workers, and install maintenance CronJob against core_apiappstatus
        LWLock storms.
      - infra.ado.ocp_aap_hub_harden - Pin Hub to dedicated unmanaged Postgres secret
        and vacuum ``core_apiappstatus`` on ``aap-hub-dedicated-postgres-0`` instead
        of shared Controller Postgres.
      - infra.ado.ocp_devspaces - Configurable disable of getting-started samples,
        default workspace image/devfile URL, and dashboard image overrides (CLI/preflight).
      - 'infra.ado.rhbk_client - Run Keycloak API tasks with ``connection: local``
        so

        client create works when the play targets a remote Satellite host.

        '
      - infra.ado.satellite_oidc - Create Keycloak client ``ado-satellite`` in realm
        ``rhlab`` with ``infra.ado.rhbk_client``, fetch the client secret, enable
        Foreman Keycloak on Satellite, and apply OIDC login-delegation settings.
      - "install_gitlab / install_grafana \u2014 standalone RHEL Omnibus GitLab CE/EE
        and Grafana roles with Contoller bootstrap playbooks and job templates (``ado-install-*-standalone-bootstrap``),
        airgap RPM path/url vars, and gitlab_standalone / grafana_standalone component
        wiring."
      - 'install_gitlab / preflight - Optional ``tls.crt`` / ``tls.key`` PEMs and

        optional RHN org + activation key for standalone URL installs. GitLab

        playbook waits for SSH and pings the host before gathering facts.

        '
      - "install_rhbk \u2014 optional standalone HTTPS on port 8443 using the same
        tls_crt/tls_key PEM pattern as the OpenShift RHBK path (install_rhbk_standalone_https_enabled)."
      - preflight - ACS form option to deploy RHACS vulnerability report job templates
        and workflow.
      - preflight - Add a visible ``Attach AAP license`` card on Install / Run (manifest
        or RHN list+attach), including license-only attach for an existing AAP without
        reinstalling the operator.
      - preflight UI - Core Environment and Pre-installs are top-level tabs; Agent
        install-config lives under Pre-installs only.
      - satellite / idm - Default component options are empty; Satellite dynamic inventory
        is an explicit selectable option.
      removed_features:
      - infra.ado.vpn_access - Removed from the collection; lab VPN / IdM user provisioning
        lives outside ADO under lab-tools (Add user to lab).
