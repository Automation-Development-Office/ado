  1.0.1:
    changes:
      bugfixes:
      - Apply generated AAP inventory sources directly with ansible.controller so
        Satellite dynamic inventory sources are created when enabled from either the
        UI preflight JSON or CLI variables.
      - Generated env var YAML now suppresses YAML anchors and preserves machine credential
        SSH private keys with a trailing newline instead of extra spaces.
      - Keep Automation Hub and optional runtime collections out of galaxy.yml hard
        dependencies so installing the built infra.ado artifact does not fail when
        public Galaxy cannot resolve Red Hat or local-only collections.
      - Normalize generated AAP survey choices so list values remain separate options
        instead of collapsing into a single dropdown entry.
      - Remove remaining install-time galaxy.yml dependency resolution so pod and
        offline installs of infra.ado use container-provided collection tarballs.
      - Satellite RHN organization IDs and activation keys are written as vault-backed
        values, with activation keys preserved when supplied by the UI.
      - Satellite bootstrap playbooks now load generated env vars from the project
        root when running under AAP and enable become where host changes require it.
      - Satellite install VG name is now generated from preflight/CLI input and raw
        installer-only fields are no longer duplicated under generic component config.
      - Satellite install role defaults and task references now consistently use `satellite_install_rhn_*`,
        `satellite_install_size*`, `satellite_install_min_*`, and other non-duplicated
        install variable names.
      - Satellite storage install variables now use the names consumed by the storage
        tasks, including `satellite_install_vg_name`, `satellite_install_req_dirs`,
        and `satellite_install_data_*`.
      - Stop silently removing checked Satellite dynamic inventory sources during
        AAP credential-type preflight unless the compatibility skip flag is explicitly
        enabled.
      - bootstrap_controller - Corrects AAP controller auth preflight messages to
        reference the generated aap_vault.yml file.
      - bootstrap_controller - Loads generated AAP config variables and enables the
        AAP apply path for collection-only Hub update runs so the Hub publish step
        is not skipped.
      - bootstrap_controller - Passes the generated AAP Hub repository target when
        publishing infra.ado so collection updates land in validated content instead
        of the published repository.
      - bootstrap_controller - Stops waiting indefinitely on AAP Hub collection import
        processing after the upload is submitted so UI runs can return the final recap.
      - bootstrap_generate_env_vars - Handles empty component and platform lists when
        running in AAP Hub collection-only update mode.
      - bootstrap_generate_env_vars - Treats an empty Satellite deployment version
        as missing and writes the default 6.19 value.
      - bootstrap_generate_env_vars - point the generated AAP execution environment
        at the supported AAP 2.6 RHEL 9 execution environment image instead of the
        generic AWX EE image so Satellite inventory syncs can load redhat.satellite.foreman.
      - bootstrap_generate_env_vars - render the Satellite TLS validation setting
        into dynamic inventory source vars so AAP Satellite inventory syncs honor
        the UI and CLI skip TLS setting.
      - bootstrap_generate_playbook_repo - Generates project collection requirements
        with an infra.ado version pin and AAP Hub source URL so AAP project syncs
        install the collection version containing newly generated roles such as ocp_virtualization.
      - satellite_config - Defaults the Satellite deployment version to 6.19 for repository
        label generation.
      - satellite_install - Defaults the Satellite deployment version to 6.19 so installs
        do not fail preliminary validation when generated vars omit the version.
      minor_changes:
      - Add OpenShift Virtualization VM launch survey options for image preference,
        instance type, custom CPU and memory, disk size, static networking, password
        setup, and optional root SSH.
      - Add Satellite install sizing, storage mount, deployment version, RHN organization,
        location, admin password, and activation key defaults to the bootstrap env
        var generator so UI and CLI preflight runs can populate the Satellite install
        role.
      - Add default Satellite install tuning tiers and storage mount definitions to
        the Satellite install role.
      - Add optional OpenShift Virtualization VM provisioning to bootstrap generation,
        including component vars, generated playbook repo content, and an AAP job
        template for CLI and UI preflight runs.
      - Limit OpenShift Virtualization preflight-derived values to the OpenShift API
        endpoint, API token, TLS verification setting, and SSH public key so VM sizing
        and guest customization are controlled from the AAP launch survey.
      - bootstrap_controller - Publishes the generated infra.ado collection to AAP
        Hub on AAP 2.5+ runs when the Hub publish option is enabled.
      - bootstrap_controller - Stops after the AAP Hub publish step when the collection-only
        update flag is enabled.
      - bootstrap_generate_env_vars - Added a collection-only Hub update flag so callers
        can update infra.ado in AAP Hub without generating component bootstrap content.
      - bootstrap_generate_env_vars - Added a generated force-update toggle for publishing
        the bundled infra.ado collection to validated content in AAP Hub.
      - collection - Fill out galaxy metadata with ADO project links, tags, and runtime
        collection dependencies.
      - collection - Standardize the collection and role Ansible requirement metadata
        on ansible-core 2.16.
      - roles - Flatten task entrypoints that only imported a single task file.
    fragments:
    - ado-hub-force-update.yml
    - bootstrap-controller-survey-choice-normalization.yml
    - bootstrap-requirements-version.yml
    - bootstrap-satellite-dynamic-inventory-direct-apply.yml
    - bootstrap-satellite-install-ui-fields.yml
    - bootstrap-supported-ee-image.yml
    - collection-metadata-ansible-216.yml
    - galaxy-runtime-dependencies.yml
    - openshift-virt-provision-vm.yml
    - satellite-bootstrap-vars-vault.yml
    - satellite-deployment-version-default.yml
    - satellite-dynamic-inventory-validate-certs.yml
    release_date: '2026-07-20'
  1.0.2:
    changes:
      bugfixes:
      - CI collections/requirements.yml - drop redhat.openshift. It is not published
        on public Galaxy (Automation Hub only), which broke ansible-galaxy install
        in GitHub Actions. Token-auth OpenShift paths use kubernetes.core; username/password
        login still needs redhat.openshift from Automation Hub at runtime.
      - aap_ocp_install, aap_ocp_install_upstream, ocp_iscsi_storage - align role
        README headings with the collection README format template so README verification
        passes.
      - aap_ocp_install_upstream - do not resolve redhat.openshift.openshift_auth
        when an OpenShift API token is already provided. Username/password login and
        token revoke live in separate task files so token-auth installs work with
        only kubernetes.core (as used by preflight bootstrap).
      - bootstrap_controller - fix OpenShift Virt VM survey apply failure where provision_openshift_virt_prefix_length
        default was emitted as the string "24" instead of integer 24 (quoted placeholder
        substitution order).
      - bootstrap_controller - normalize string and dictionary AAP labels before creating
        them so generated organization labels do not fail AAP 2.5+ bootstrap runs.
      - bootstrap_generate_env_vars / OpenShift Virt playbook - inherit OpenShift
        skip_tls_verify (and API host/token when blank) for VM provisioning, and fall
        back to generated OpenShift TLS vars so the job no longer fails when provision_openshift_virt_skip_tls_verify
        is unset.
      - bootstrap_generate_playbook_repo - configure generated AAP projects to sync
        on launch and wait for project creation so job runs pick up current collection
        requirements from the generated repository.
      - bootstrap_generate_playbook_repo - generate infra.ado collection requirements
        with only the collection name and version so AAP resolves the source through
        its configured content repositories.
      - bootstrap_resolve_component - normalize app_domain from the generated apps_domain
        value (or derive apps.<domain> for legacy vars) before rendering component
        defaults, and register openshift_virt so VM provisioning no longer fails during
        common variable resolution.
      - ci - remove unsupported ``user`` platform key from ``integration_rhel_patching``
        and ``integration_rhel_repos_default`` Molecule configs so podman driver schema
        validation passes.
      - ocp_iscsi_storage - wrap multi-document CSI manifests as Kubernetes List resources
        and clear executable bits so ansible-test yamllint and shebang sanity checks
        pass.
      minor_changes:
      - 'Bootstrap can materialize OpenShift auth from an uploaded kubeconfig

        (or host+token), then optionally install Admin HTPasswd and NFS CSI

        storage in the preflight pod before AAP install.

        '
      - OpenShift Virt network defaults - drop preflight static IP seeding; add optional
        ip_range guidance for the survey help text while keeping gateway, DNS, and
        prefix_length as optional survey defaults.
      - 'Wire the ``iscsi_csi`` OpenShift option to ``ocp_iscsi_storage``

        (bundled Synology CSI manifests via kubernetes.core, client-info

        secret from DSM credentials, StorageClass, optional snapshotter)

        with bootstrap prep, playbook, and job template support.

        '
      - 'Wire the ``nfs_csi`` OpenShift option to ``ocp_nfs_storage`` (Helm

        csi-driver-nfs 4.11.0, privileged SCC RoleBindings, StorageClass)

        with playbook and job template support.

        '
      - aap_ocp_install - add an ADO wrapper around the vendored infra.aap_utilities
        3.5.0 aap_ocp_install role for AAP 2.5 and 2.6 operator/platform deployments
        on OpenShift.
      - bootstrap AAP on OpenShift install - add component_config.aap.minimal_footprint
        to disable Hub, EDA, and Lightspeed for CPU-constrained clusters (Controller
        + Gateway only).
      - 'bootstrap AAP on OpenShift install - support component_config.aap.admin_username
        / admin_password (vault: aap_admin_password). Bootstrap creates the ``{instance}-admin-password``
        Secret and sets ``spec.admin_password_secret`` on the AnsibleAutomationPlatform
        CR.'
      - bootstrap roles - generate native aap_ocp_install variables and a single AAP-on-OpenShift
        playbook/job template instead of the incomplete copied AAP 2.4 placeholders.
      - bootstrap_controller / preflight - add component_config.aap.install_during_bootstrap.
        When true, bootstrap writes install vars, runs infra.ado.aap_ocp_install in
        the preflight pod, and skips playbook/AAP config generation, Controller connectivity/smoke/apply,
        and the Install AAP job template. Rerun bootstrap once AAP is up to configure
        the Controller. When false (default), selecting the OpenShift aap app still
        generates that job template and OpenShift workflow node for later use.
      - bootstrap_generate_env_vars - write Satellite manifest uploads as satellite_config_manifest_file
        (with derived src/path and upload flag) for the Satellite configure playbook.
      - bootstrap_generate_env_vars / OpenShift Virt - accept optional preflight static_ip,
        prefix_length, gateway, and dns_servers values, write them to generated vars
        (including openshift_virt_network_defaults), and seed the Provision OpenShift
        Virt VM survey defaults from those values.
      - bootstrap_generate_env_vars / bootstrap_controller - configure AAP 2.5+ Automation
        Gateway authenticators from preflight aap.auth (Keycloak OIDC, LDAP, Keycloak
        SAML). Writes vault_gateway_auth.yml and applies gateway_authenticators /
        gateway_authenticator_maps through infra.aap_configuration.dispatch during
        bootstrap.
      - bootstrap_generate_env_vars / satellite_config - emit and default satellite_config_rhn_connected
        to true; UI/CLI preflight can override with component_config.satellite.rhn_connected.
      - bootstrap_generate_playbook_repo - include kubernetes.core and redhat.openshift
        in generated project collection requirements.
