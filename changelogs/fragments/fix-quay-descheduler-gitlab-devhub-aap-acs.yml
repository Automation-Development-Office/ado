---
bugfixes:
  - >-
    ocp_descheduler - Match real CSV name ``clusterkubedescheduleroperator``
    (hyphenated substring never matched).
  - >-
    gitlab - Wait for CSV in ``gitlab-system`` (where Subscription installs),
    not empty ``gitlab`` namespace.
  - >-
    dev_hub - Subscribe to package ``rhdh`` on channel ``fast`` (old
    ``redhat-developer-hub-operator`` package is gone from the catalog).
  - >-
    ocp_quay - Grant ``anyuid`` to default SA so Postgres (uid 26) can schedule
    under OpenShift restricted SCCs.
  - >-
    aap_ocp_install - Resolve component defaults in the AAP playbook so
    ``aap_ocp_install_reset_database=true`` actually runs; fail fast when
    gateway pods never become Ready (Fernet InvalidToken / 503).
  - >-
    ocp_acs - Default ``ocp_acs_reinstall`` to false so every run does not wipe
    central-db PVCs; when reinstall is on, wait for PVC deletion to finish.
  - >-
    ocp_wait_operator - Also match hyphen-stripped CSV names and emit clearer
    timeout guidance (namespace + pattern + CSVs present).
