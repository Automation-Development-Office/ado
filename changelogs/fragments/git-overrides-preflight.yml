---
minor_changes:
  - >-
    Preflight bootstrap (ado-preflight-ui) — Replace the single git overwrite
    checkbox with a Git overrides section: optional
    ``group_vars/all/<env>``, job/workflow templates, or full re-clone wipe.
    Default (all unchecked) keeps the pod clone and only commits incremental
    bootstrap changes.
bugfixes:
  - >-
    bootstrap_controller — Honor
    ``bootstrap_controller_generate_aap_configs_force_job_workflows`` when
    generating ``configs/job_templates`` and ``configs/workflows`` (skip
    overwrite, prune, and in-place workflow rewrites when false).
  - >-
    bootstrap_generate_playbook_repo — Default
    ``bootstrap_generate_playbook_repo_force`` to false; preflight passes true
    only when Git override (all) is selected.
