---
bugfixes:
  - >-
    Forward Automation Hub Galaxy server env vars through tox-ansible so sanity
    and unit jobs resolve certified collection dependencies from console.redhat.com.
  - >-
    Remove unused variable from verify-automation-hub.sh so ansible-test shellcheck
    sanity passes.
  - >-
    Accept HTTP 401 or 403 from the unauthenticated Automation Hub published-API
    probe in verify-automation-hub.sh. Red Hat Hub normally returns 401 without a
    token (auth required); 403 is tolerated because upstream proxies or API
    gateways sometimes classify missing credentials as Forbidden instead of
    Unauthorized. Either status still confirms the URL is reachable and not
    anonymously open, while 200 would indicate a misconfiguration and 5xx still
    fails the check. Galaxy remains 200-only; authenticated ansible.platform
    install remains the definitive Hub token test.
