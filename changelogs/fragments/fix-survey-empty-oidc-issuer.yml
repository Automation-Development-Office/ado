---
bugfixes:
  - >-
    bootstrap_resolve_component - Export registry defaults when survey or
    extra_vars pass empty strings, not only when keys are undefined.
  - >-
    netbox_oidc - Resolve issuer into netbox_oidc_issuer_resolved so survey
    netbox_oidc_issuer empty string cannot block asserts (extra_vars beat
    same-name set_fact).
  - >-
    bookstack_openshift - Resolve OIDC issuer into bookstack_openshift_oidc_issuer_resolved
    when Keycloak or RHBK issuer survey fields are empty.
  - >-
    ocp_minio - Recreate Deployment when selector labels drift (immutable patch
    failure on re-run); treat empty minio_oidc_issuer as unset.
  - >-
    install_dirsrv - Treat suffix-backend already present or exists stdout as
    success on idempotent re-run.
