---
bugfixes:
  - bootstrap_controller - Publish the preflight pod tarball to Hub instead of rebuilding from extracted source (avoids artifact drift).
  - bootstrap_controller - Keep galaxy filename ``infra-ado-*.tar.gz`` for Hub upload (``ado-collection-artifact.tar.gz`` parsed wrong namespace/name).
  - >-
    bootstrap_controller - Upload infra.ado to Hub ``staging`` then move into the
    target repository (e.g. ``validated``). Pipeline-approved repos reject direct
    uploads; prior direct-to-validated uploads returned changed but never appeared
    in Hub UI.
  - bootstrap_controller - Verify promoted collection version via Hub Galaxy API before succeeding.
  - bootstrap_controller - Remove staging upload debug task that crashed Jinja after a successful Hub import.
  - >-
    bootstrap_controller - On hub-only runs, skip Contoller org create from stale
    configs before Hub publish. Prefer ``vault_galaxy_hub_token`` for Hub API auth.
  - >-
    bootstrap_controller - Do not fail a successful Hub publish when Contoller
    Galaxy/org attach 401s. Galaxy attach only runs when ``galaxy_setup_enabled``
    is true (not inferred from leftover git credential YAML).

minor_changes:
  - ado-preflight-ui - Copy Hub tarball to ``/workspace/infra-ado-*.tar.gz`` preserving the galaxy artifact name.
