---
minor_changes:
  - >-
    bootstrap AAP on OpenShift install - support component_config.aap.admin_username
    / admin_password (vault: aap_admin_password). Bootstrap creates the
    ``{instance}-admin-password`` Secret and sets
    ``spec.admin_password_secret`` on the AnsibleAutomationPlatform CR.
  - >-
    bootstrap AAP on OpenShift install - add component_config.aap.minimal_footprint
    to disable Hub, EDA, and Lightspeed for CPU-constrained clusters
    (Controller + Gateway only).
