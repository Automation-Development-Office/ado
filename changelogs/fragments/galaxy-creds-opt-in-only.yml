---
bugfixes:
  - bootstrap_generate_env_vars - Galaxy/Hub API credentials and org attachments
    are emitted only when ``galaxy_setup_enabled`` is true and
    ``galaxy_hub_token`` is non-empty; hub-only publish no longer pushes lab
    Galaxy creds.
  - bootstrap_controller - Skip Galaxy credential create/attach when Hub token
    is missing.
  - bootstrap_generate_env_vars - Galaxy credential URLs use Hub hostname;
    container registry credential can be created for EE push without enabling
    full Galaxy setup.
