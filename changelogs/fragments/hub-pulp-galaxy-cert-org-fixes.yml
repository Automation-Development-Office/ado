---
bugfixes:
  - >-
    bootstrap_controller - Hub Pulp ``ansible.builtin.uri`` calls use
    ``Authorization: Token`` (matching ``ansible.hub`` ``ah_token``) instead of
    ``Bearer``, and omit admin user/password when a Hub API token is set.
  - >-
    bootstrap_controller - On hub-only runs, ensure the General Controller
    organization exists before Hub publish when Galaxy credentials or Hub EE
    Controller objects are enabled.
minor_changes:
  - >-
    bootstrap_generate_env_vars / bootstrap_generate_playbook_repo -
    ``ansible_dispatch_ignore_galaxy_cert`` defaults to false; preflight Galaxy
    tab checkbox opts in to ``GALAXY_IGNORE_CERTS`` and ``[galaxy] ignore_certs``
    for lab self-signed Hub TLS.
