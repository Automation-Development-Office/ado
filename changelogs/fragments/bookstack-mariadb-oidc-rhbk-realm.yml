---
bugfixes:
  - >-
    bookstack_openshift - Run MariaDB as UID/fsGroup 999 so PVC data dir is
    writable under anyuid on OpenShift (fixes CrashLoop Permission denied on
    /var/lib/mysql).
  - >-
    bootstrap_generate_env_vars, netbox_oidc, bookstack, minio playbooks -
    Derive OIDC issuer and Keycloak realm from preflight RHBK hostname/realm
    (vars_rhbk.yml) instead of hardcoded prod ``rhlab`` defaults.
