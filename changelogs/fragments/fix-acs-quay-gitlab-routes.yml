---
bugfixes:
  - >-
    ocp_acs - Use reencrypt Central Route with destinationCA from
    ``central-tls`` so browsers trust the cluster ingress / cert-manager lab
    cert instead of Central's self-signed passthrough certificate.
  - >-
    ocp_quay - Quay listens on HTTP ``8080`` in this install path: Service/Route
    target that port with ``edge`` TLS (not ``8443`` / reencrypt). Ensure
    ``pg_trgm``, ``SETUP_COMPLETE: true``, and disable
    ``FEATURE_ACTION_LOG_ROTATION`` unless archive storage is configured.
  - >-
    gitlab_install / components_defaults - Pin OpenShift GitLab chart to
    ``9.5.0``. Chart ``10.x`` requires external Postgres, Redis, and object
    storage and left GitLab stuck in ``Preparing`` with an empty webservice.
