---
minor_changes:
  - infra.ado.idm_ad_trust - Run ``ipa-adtrust-install``, ensure SMB, open
    ``freeipa-trust`` firewall, disable DNSSEC validation for AD forward zones,
    re-kinit after AD trust install, and support one-way or two-way trusts.
  - bootstrap_controller - Add ``ADO | IdM Manage AD Trust`` job template for
    ``idm_ad_trust_install``.
  - bootstrap_generate_env_vars - Overlay IdM AD trust vars/vault secrets from
    preflight and create IdM inventory when AD Trust is selected.
  - bootstrap_generate_playbook_repo - AD trust bootstrap playbook loads
    ``vars_idm.yml``/``vault_idm.yml`` and targets the IdM inventory.
bugfixes:
  - infra.ado.idm_ad_trust - Detect existing trusts case-insensitively so
    ``trust-add`` is not retried after a successful establish.
