---
minor_changes:
  - >-
    capsule_install - Added firewall, DNS, and custom Capsule certificate
    generation tasks after package installation.
  - >-
    capsule_install - Renamed OAuth consumer facts to
    ``capsule_install_foreman_proxy_oauth_consumer_key`` and
    ``capsule_install_foreman_proxy_oauth_consumer_secret``.
  - >-
    capsule_install - Ensure ``firewalld`` is installed before enabling the
    ``RH-Satellite-6-capsule`` service and opening load-balancer ports.
  - >-
    capsule_install - Omit load-balancer ``delegate_to`` when
    ``capsule_install_loadbalancer_fqdn`` is undefined so HAProxy-disabled runs
    do not fail firewall configuration.
doc_changes:
  - capsule_install - Documented firewall, DNS, and custom certificate generation tasks and DNS variables.
