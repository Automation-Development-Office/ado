- name: Wait for Keycloak HTTPS before realm API
  ansible.builtin.import_tasks: rhbk_wait_ready.yml
  when: state == "present"

- name: Create RHBK realm
  ansible.builtin.import_tasks: rhbk_create_realm.yml
  when: state == "present"

- name: Delete RHBK realm
  ansible.builtin.import_tasks: rhbk_delete_realm.yml
  when: state == "absent"
