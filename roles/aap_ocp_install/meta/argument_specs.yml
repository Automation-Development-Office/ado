---
argument_specs:
  main:
    short_description: Install AAP 2.5, 2.6, or 2.7 on OpenShift.
    description:
      - Validates the ADO-supported AAP channels.
      - Delegates operator and platform installation to infra.aap_utilities.aap_ocp_install.
    options:
      aap_ocp_install_namespace:
        type: str
        required: true
        description: OpenShift namespace for the AAP operator and platform.
      aap_ocp_install_create_namespace:
        type: bool
        default: true
        description: Whether the upstream role creates the namespace.
      aap_ocp_install_connection:
        type: dict
        required: true
        description: OpenShift API connection accepted by infra.aap_utilities.
      aap_ocp_install_operator:
        type: dict
        required: true
        description: AAP operator configuration with a stable-2.5, stable-2.6, or stable-2.7 channel.
      aap_ocp_install_platform:
        type: dict
        required: true
        description: AnsibleAutomationPlatform CR configuration.
      aap_ocp_install_controller:
        type: dict
        default: {}
        description: Controller component enablement and overrides.
      aap_ocp_install_hub:
        type: dict
        default: {}
        description: Automation Hub component enablement and storage.
      aap_ocp_install_eda:
        type: dict
        default: {}
        description: EDA component enablement and overrides.
      aap_ocp_install_lightspeed:
        type: dict
        default: {}
        description: Lightspeed component enablement.
