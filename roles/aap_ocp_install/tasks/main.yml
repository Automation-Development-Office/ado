---
- name: Validate ADO AAP on OpenShift installer inputs
  ansible.builtin.assert:
    that:
      - aap_ocp_install_namespace | default('') | length > 0
      - aap_ocp_install_connection is mapping
      - aap_ocp_install_operator is mapping
      - aap_ocp_install_operator.channel | default('') | length > 0
      - aap_ocp_install_platform is mapping
      - aap_ocp_install_platform.instance_name | default('') | length > 0
      - >-
        aap_ocp_install_operator.channel
        is regex('^stable-(2\.5|2\.6|2\.7)(-|$)')
    fail_msg: >-
      infra.ado.aap_ocp_install supports AAP 2.5, 2.6, and 2.7 platform
      installs. Provide namespace, OpenShift connection, operator channel
      (stable-2.5*, stable-2.6*, or stable-2.7*), and platform instance_name.
  when: not (aap_ocp_install_license_only | default(false) | bool)

- name: Validate license-only attach inputs
  ansible.builtin.assert:
    that:
      - (aap_ocp_install_license_mode | default('none') | lower) not in ['', 'none', 'skip']
      - >-
        (
          aap_ocp_install_controller_route_host | default('') | length > 0
        )
        or (hostname | default('') | length > 0)
        or (aap_hostname | default('') | length > 0)
    fail_msg: >-
      License-only attach requires license_mode (manifest or rhn) and the AAP
      hostname / controller route (component_config.aap.hostname).
  when: aap_ocp_install_license_only | default(false) | bool

- name: Install AAP on OpenShift with vendored infra.aap_utilities role
  ansible.builtin.include_role:
    name: infra.ado.aap_ocp_install_upstream
    public: true
  when: not (aap_ocp_install_license_only | default(false) | bool)

- name: Activate AAP subscription license when configured
  ansible.builtin.include_tasks: activate_license.yml
  when: (aap_ocp_install_license_mode | default('none') | lower) not in ['', 'none', 'skip']
