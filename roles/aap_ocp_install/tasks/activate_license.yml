---
- name: Skip AAP license activation when mode is none
  ansible.builtin.meta: end_host
  when: (aap_ocp_install_license_mode | default('none') | lower) in ['', 'none', 'skip']

- name: Resolve controller route host for license activation
  ansible.builtin.set_fact:
    aap_ocp_install_controller_route_host: >-
      {{
        aap_ocp_install_controller_route_host
        | default(controller_route_host | default(aap_hostname | default(hostname | default(''))))
      }}

- name: Assert controller route host for license activation
  ansible.builtin.assert:
    that:
      - aap_ocp_install_controller_route_host | length > 0
    fail_msg: Set aap_ocp_install_controller_route_host (or hostname) before license activation

- name: Upload subscription manifest to AAP Controller
  ansible.builtin.uri:
    url: "https://{{ aap_ocp_install_controller_route_host }}/api/controller/v2/config/"
    method: POST
    user: "{{ aap_ocp_install_admin_user | default(admin_user | default('admin')) }}"
    password: "{{ aap_ocp_install_admin_password | default(aap_admin_password | default('')) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: form-multipart
    body:
      manifest:
        filename: "{{ aap_ocp_install_subscription_manifest_filename | default('manifest.zip') }}"
        content: "{{ lookup('file', aap_ocp_install_subscription_manifest_path) }}"
    status_code: [200, 201, 204]
  when:
    - (aap_ocp_install_license_mode | default('none') | lower) == 'manifest'
    - aap_ocp_install_subscription_manifest_path | default('') | length > 0
  no_log: true

- name: Upload subscription manifest from base64 content
  ansible.builtin.uri:
    url: "https://{{ aap_ocp_install_controller_route_host }}/api/controller/v2/config/"
    method: POST
    user: "{{ aap_ocp_install_admin_user | default(admin_user | default('admin')) }}"
    password: "{{ aap_ocp_install_admin_password | default(aap_admin_password | default('')) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: form-multipart
    body:
      manifest:
        filename: "{{ aap_ocp_install_subscription_manifest_filename | default('manifest.zip') }}"
        content: "{{ aap_ocp_install_subscription_manifest_content_base64 | b64decode }}"
    status_code: [200, 201, 204]
  when:
    - (aap_ocp_install_license_mode | default('none') | lower) == 'manifest'
    - aap_ocp_install_subscription_manifest_path | default('') | length == 0
    - aap_ocp_install_subscription_manifest_content_base64 | default('') | length > 0
  no_log: true

- name: Activate AAP subscription via Red Hat credentials
  ansible.builtin.uri:
    url: "https://{{ aap_ocp_install_controller_route_host }}/api/controller/v2/config/"
    method: POST
    user: "{{ aap_ocp_install_admin_user | default(admin_user | default('admin')) }}"
    password: "{{ aap_ocp_install_admin_password | default(aap_admin_password | default('')) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      username: "{{ aap_ocp_install_rhn_username }}"
      password: "{{ aap_ocp_install_rhn_password }}"
    status_code: [200, 201, 204]
  when:
    - (aap_ocp_install_license_mode | default('none') | lower) == 'rhn'
    - aap_ocp_install_rhn_username | default('') | length > 0
    - aap_ocp_install_rhn_password | default('') | length > 0
  no_log: true
