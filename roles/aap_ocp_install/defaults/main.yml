---
# Supported AAP versions for the ADO bootstrap integration. The delegated
# infra.aap_utilities role remains responsible for operator/CR implementation.
aap_ocp_install_ado_supported_versions:
  - "2.5"
  - "2.6"
  - "2.7"

# none | manifest | rhn
aap_ocp_install_license_mode: none
# When true, skip operator/platform install and only run activate_license.yml
# (attach to an existing AAP instance).
aap_ocp_install_license_only: false
aap_ocp_install_subscription_manifest_path: ""
aap_ocp_install_subscription_manifest_content_base64: ""
aap_ocp_install_subscription_manifest_filename: manifest.zip
aap_ocp_install_rhn_username: ""
aap_ocp_install_rhn_password: ""
aap_ocp_install_rhn_subscription_id: ""
aap_ocp_install_rhn_client_id: ""
aap_ocp_install_rhn_client_secret: ""
aap_ocp_install_admin_user: admin
aap_ocp_install_admin_password: ""
aap_ocp_install_controller_route_host: ""
