---
# Generate RHACS vulnerability reports from Central workload export.
# Modes: raw | rhsource | age | all  (+ all_scope / rhsre / component filters)

- name: Validate acs_report mode
  ansible.builtin.assert:
    that:
      - (acs_report_mode | default('')) | length > 0
      - acs_report_mode is in ['raw', 'rhsource', 'age', 'all']
    fail_msg: >-
      Set acs_report_mode to one of: raw, rhsource, age, all.

- name: Resolve ACS Central URL
  ansible.builtin.set_fact:
    acs_report_central_url: >-
      {{
        (
          acs_central_url
          | default(rox_endpoint | default(''), true)
          | default(
              'https://'
              ~ (acs_route_name | default('central'))
              ~ '-'
              ~ (acs_namespace | default(ocp_acs_namespace | default('stackrox')))
              ~ '.'
              ~ (app_domain | default(apps_domain | default(''))),
              true
            )
        )
        | regex_replace('/$', '')
      }}

- name: Resolve ACS API token
  ansible.builtin.set_fact:
    acs_report_api_token: >-
      {{
        acs_api_token
        | default(rox_api_token | default(''), true)
        | default(lookup('env', 'ROX_API_TOKEN'), true)
      }}
  no_log: true

- name: Assert ACS Central credentials
  ansible.builtin.assert:
    that:
      - acs_report_central_url | length > 0
      - >-
        (acs_report_api_token | default('') | length > 0)
        or (acs_admin_password | default(ocp_acs_admin_password | default('')) | length > 0)
    fail_msg: >-
      Provide acs_central_url (or app_domain for route derivation) and
      acs_api_token / ROX_API_TOKEN, or acs_admin_password for basic auth.

- name: Ensure report output directory exists
  ansible.builtin.file:
    path: "{{ acs_report_outdir }}"
    state: directory
    mode: "0755"

- name: Set export and parser paths
  ansible.builtin.set_fact:
    acs_report_stamp: "{{ now(utc=true).strftime('%Y-%m-%d_%H%M%S') }}"
    acs_report_parser_dest: "{{ acs_report_outdir }}/rhacs_report_parser.py"
    acs_report_export_file: >-
      {{ acs_report_outdir }}/RHACS_workloads_export.ndjson

- name: Stage RHACS report parser
  ansible.builtin.copy:
    src: rhacs_report_parser.py
    dest: "{{ acs_report_parser_dest }}"
    mode: "0644"

- name: Download Central workload export (token)
  ansible.builtin.get_url:
    url: >-
      {{ acs_report_central_url }}{{ acs_report_export_path }}?timeout={{ acs_report_export_timeout | int }}
    dest: "{{ acs_report_export_file }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ acs_report_api_token }}"
    timeout: "{{ (acs_report_http_timeout | default(acs_report_curl_max_time | default(1200))) | int }}"
    validate_certs: "{{ acs_report_validate_certs | bool }}"
    follow_redirects: none
    force: true
    mode: "0600"
  no_log: true
  when: (acs_report_api_token | default('') | length) > 0

- name: Download Central workload export (basic auth)
  ansible.builtin.get_url:
    url: >-
      {{ acs_report_central_url }}{{ acs_report_export_path }}?timeout={{ acs_report_export_timeout | int }}
    dest: "{{ acs_report_export_file }}"
    headers:
      Accept: application/json
    url_username: "{{ acs_admin_user | default(ocp_acs_admin_user | default('admin')) }}"
    url_password: "{{ acs_admin_password | default(ocp_acs_admin_password | default('')) }}"
    force_basic_auth: true
    timeout: "{{ (acs_report_http_timeout | default(acs_report_curl_max_time | default(1200))) | int }}"
    validate_certs: "{{ acs_report_validate_certs | bool }}"
    follow_redirects: none
    force: true
    mode: "0600"
  no_log: true
  when: (acs_report_api_token | default('') | length) == 0

- name: Parse Central export
  ansible.builtin.command:
    argv:
      - python3
      - "{{ acs_report_parser_dest }}"
      - "{{ acs_report_mode }}"
      - "{{ acs_report_component | default('') }}"
      - "{{ acs_report_outdir }}"
      - "{{ '1' if (acs_report_all_scope | default(false) | bool) else '0' }}"
      - "{{ '1' if (acs_report_rhsre | default(false) | bool) else '0' }}"
      - "{{ '1' if (acs_report_show_sev | default(false) | bool) else '0' }}"
      - "{{ (acs_report_clusters | default([])) | join(',') }}"
      - "{{ acs_report_export_file }}"
  register: acs_report_run
  changed_when: true

- name: Write RHACS report text capture
  ansible.builtin.copy:
    content: "{{ acs_report_run.stdout | default('') }}"
    dest: >-
      {{ acs_report_outdir }}/RHACS_report_{{ acs_report_mode }}_{{ acs_report_stamp }}.txt
    mode: "0644"
  when: (acs_report_run.stdout | default('') | length) > 0

- name: Show RHACS report stdout
  ansible.builtin.debug:
    msg: "{{ acs_report_run.stdout_lines | default([]) }}"
  when: (acs_report_run.stdout_lines | default([]) | length) > 0

- name: Stage sample Grafana dashboard into outdir
  ansible.builtin.copy:
    src: grafana/{{ item }}
    dest: "{{ acs_report_outdir }}/{{ item }}"
    mode: "0644"
  loop:
    - rhacs-vulnerability-overview.json
    - sample-prod-summary.json
  when: acs_report_stage_grafana_sample | default(true) | bool

- name: Enrich RHACS CSV with acs-cve-plugin
  ansible.builtin.include_tasks: cve_enrich.yml
  when: acs_report_cve_enrich | default(false) | bool

- name: Find generated report artifacts
  ansible.builtin.find:
    paths: "{{ acs_report_outdir }}"
    patterns:
      - "RHACS_*.csv"
      - "RHACS_*-fp.csv"
      - "RHACS_*-poam.csv"
      - "RHACS_*.json"
      - "RHACS_*.txt"
      - "rhacs-vulnerability-overview.json"
      - "sample-prod-summary.json"
  register: acs_report_artifacts

- name: Publish artifact paths
  ansible.builtin.set_fact:
    acs_report_artifact_paths: "{{ acs_report_artifacts.files | map(attribute='path') | list }}"

- name: Report artifact paths
  ansible.builtin.debug:
    var: acs_report_artifact_paths
