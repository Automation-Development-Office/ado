---
# roles/ dirsrv/tasks/main.yml
# Single-file role: deploy  dirsrv (SA/RBAC/Secret/Services/STS) + optional cert + bootstrap + replication

- name: DirSrv Normalize inputs (component vars + vault)
  ansible.builtin.set_fact:
    install_dirsrv_target_namespace: "{{ name_space }}"
    install_dirsrv_storage_class_name_effective: "{{ (storage_class_name | default('')) | string | trim }}"
    install_dirsrv_selector_effective: "{{ ocp_dirsrv_selector | default({'app': 'dirsrv'}) }}"

    # Vault root key is historically "dirsrv" (also accept "389ds" or flat var).
    # Playbooks should load vault_dirsrv.yml (not vault_{{ env }}.yml).
    install_dirsrv_dm_password: >-
      {{
        (
          (vars['dirsrv'].ocp_dirsrv_manager_password)
          if (vars['dirsrv'] is defined and (vars['dirsrv'].ocp_dirsrv_manager_password | default('') | string | length) > 0)
          else (
            (vars['389ds'].ocp_dirsrv_manager_password)
            if (vars['389ds'] is defined and (vars['389ds'].ocp_dirsrv_manager_password | default('') | string | length) > 0)
            else (ocp_dirsrv_manager_password | default(''))
          )
        )
        | mandatory(
          'Missing dirsrv.ocp_dirsrv_manager_password. Set it in group_vars/all/'
          ~ (env | default('ENV'))
          ~ '/vault_dirsrv.yml under key dirsrv: (not vault_389ds.yml / vault_'
          ~ (env | default('ENV'))
          ~ '.yml).'
        )
      }}
    install_dirsrv_ds_suffix_effective: >-
      {{
        (
          (vars['dirsrv'].ds_suffix | default(''))
          if (vars['dirsrv'] is defined)
          else (vars['389ds'].ds_suffix | default('') if (vars['389ds'] is defined) else '')
        ) | string | trim
      }}
    install_dirsrv_repl_manager_password_effective: >-
      {{
        (
          (vars['dirsrv'].repl_manager_password | default(''))
          if (vars['dirsrv'] is defined)
          else (vars['389ds'].repl_manager_password | default('') if (vars['389ds'] is defined) else '')
        ) | string | trim
      }}
    install_dirsrv_test_user_uid_effective: >-
      {{
        (
          (vars['dirsrv'].test_user_uid | default('testuser'))
          if (vars['dirsrv'] is defined)
          else (vars['389ds'].test_user_uid | default('testuser') if (vars['389ds'] is defined) else 'testuser')
        ) | string | trim
      }}
  changed_when: false

# kubernetes.core.k8s JSON-encodes quoted "{{ x | int }}" as strings → ServicePort int32 errors.
# Build port maps in pure Jinja so | int stays numeric.
- name: DirSrv Coerce Service / container ports to int
  ansible.builtin.set_fact:
    install_dirsrv_internal_ports: "{{ [{'name': 'dirsrv-nonsecure', 'port': ldap_port | int, 'targetPort': ldap_port | int, 'protocol': 'TCP'}, {'name': 'dirsrv-secure', 'port': ldaps_port | int, 'targetPort': ldaps_port | int, 'protocol': 'TCP'}] }}"
    install_dirsrv_external_ports: "{{ [{'name': 'dirsrv-nonsecure', 'port': ldap_port | int, 'targetPort': ldap_port | int, 'protocol': 'TCP', 'nodePort': nodeport_ldap | int}, {'name': 'dirsrv-secure', 'port': ldaps_port | int, 'targetPort': ldaps_port | int, 'protocol': 'TCP', 'nodePort': nodeport_ldaps | int}] }}"
    install_dirsrv_container_ports: "{{ [{'name': 'ldap', 'containerPort': ldap_port | int}, {'name': 'ldaps', 'containerPort': ldaps_port | int}] }}"
    install_dirsrv_probe_port: "{{ [ldap_port | int] }}"
    # Keep replicas as a one-element list so | first stays int32 for k8s (quoted | int becomes string).
    install_dirsrv_replicas: "{{ [expected_replicas | int] }}"
  changed_when: false

- name: DirSrv Assert required component vars
  ansible.builtin.assert:
    that:
      - install_dirsrv_target_namespace | length > 0
      - statefulset_name is defined and (statefulset_name | string | trim | length) > 0
      - expected_replicas is defined
      - init_image is defined and (init_image | string | trim | length) > 0
      - ocp_dirsrv_image is defined and (ocp_dirsrv_image | string | trim | length) > 0
      - pvc_size is defined and (pvc_size | string | trim | length) > 0
      - install_dirsrv_storage_class_name_effective | length > 0
      - sa_name is defined and (sa_name | string | trim | length) > 0
      - scc_name is defined and (scc_name | string | trim | length) > 0
      - dm_secret_name is defined and (dm_secret_name | string | trim | length) > 0
      - dm_secret_key is defined and (dm_secret_key | string | trim | length) > 0
    fail_msg: >-
      Missing required vars for  dirsrv. Ensure components_defaults.yml contains required keys and
      vars_{{ env }}.yml provides components_env. dirsrv.storage_class_name at minimum.
  changed_when: false

- name: DirSrv Guard bootstrap inputs (vault)
  ansible.builtin.assert:
    that:
      - install_dirsrv_ds_suffix_effective | length > 0
    fail_msg: "enable_bootstrap=true requires dirsrv.ds_suffix in vault_dirsrv.yml"
  when: enable_bootstrap | default(true) | bool
  changed_when: false

- name: Dirsrv Guard replication inputs (vault)
  ansible.builtin.assert:
    that:
      - install_dirsrv_repl_manager_password_effective | length > 0
    fail_msg: "enable_replication=true requires dirsrv.repl_manager_password in vault_dirsrv.yml"
  when: enable_replication | default(true) | bool
  changed_when: false

# --------------------------
# SA + SCC binding
# --------------------------

- name: Dirsrv Create ServiceAccount
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ sa_name }}"
        namespace: "{{ install_dirsrv_target_namespace }}"

- name: Dirsrv Bind SCC anyuid to SA (RoleBinding)
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "use-{{ scc_name }}-scc-{{ sa_name }}"
        namespace: "{{ install_dirsrv_target_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "system:openshift:scc:{{ scc_name }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ sa_name }}"
          namespace: "{{ install_dirsrv_target_namespace }}"

# --------------------------
# Secret
# --------------------------

- name: Dirsrv Ensure Directory Manager password Secret
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ dm_secret_name }}"
        namespace: "{{ install_dirsrv_target_namespace }}"
      type: Opaque
      stringData: "{{ {dm_secret_key | string: install_dirsrv_dm_password | string} }}"
  no_log: true

# --------------------------
# Services
# --------------------------

- name: Dirsrv Apply internal (headless) Service
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: dirsrv-internal-svc
        namespace: "{{ install_dirsrv_target_namespace }}"
        labels: "{{ install_dirsrv_selector_effective }}"
      spec:
        clusterIP: None
        selector: "{{ install_dirsrv_selector_effective }}"
        ports: "{{ install_dirsrv_internal_ports }}"

- name: Dirsrv Apply external (NodePort) Service
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: dirsrv-external-svc
        namespace: "{{ install_dirsrv_target_namespace }}"
        labels: "{{ install_dirsrv_selector_effective }}"
      spec:
        type: NodePort
        selector: "{{ install_dirsrv_selector_effective }}"
        ports: "{{ install_dirsrv_external_ports }}"
# --------------------------
# Optional Certificate
# --------------------------

- name: Dirsrv Apply cert-manager Certificate (optional)
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ certificate_name }}"
        namespace: "{{ install_dirsrv_target_namespace }}"
      spec:
        secretName: "{{ certificate_secret }}"
        dnsNames: "{{ certificate_dns }}"
        duration: "{{ certificate_duration }}"
        renewBefore: "{{ certificate_renew_before }}"
        issuerRef:
          kind: "{{ certificate_issuer_kind }}"
          name: "{{ certificate_issuer_name }}"
        privateKey:
          algorithm: RSA
          encoding: PKCS1
          size: 2048
        subject:
          organizations: "{{ certificate_orgs }}"
          organizationalUnits: "{{ certificate_ous }}"
  when: enable_certificate | default(false) | bool

# --------------------------
# Optional Cleanup
# --------------------------

- name: Dirsrv Remove existing StatefulSet (cleanup toggle; PVC retained by policy)
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ statefulset_name }}"
    namespace: "{{ install_dirsrv_target_namespace }}"
    state: absent
  when: ocp_dirsrv_cleanup | default(false) | bool

# --------------------------
# StatefulSet
# --------------------------

- name: Dirsrv Apply StatefulSet
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ lookup('ansible.builtin.template', 'statefulset.yml.j2') | from_yaml }}"

- name: Dirsrv Wait for StatefulSet to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ install_dirsrv_target_namespace }}"
    name: "{{ statefulset_name }}"
  register: install_dirsrv_sts_info
  until: >
    (install_dirsrv_sts_info.resources | length) > 0 and
    ((install_dirsrv_sts_info.resources[0].status.readyReplicas | default(0)) | int >= (expected_replicas | int))
  retries: 60
  delay: 10
  changed_when: false

# --------------------------
# Pods | list
# --------------------------

- name: Dirsrv Gather Directory Server pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ install_dirsrv_target_namespace }}"
    label_selectors:
      - "{{ label_selector | default('app=dirsrv') }}"
  register: install_dirsrv_pods

- name: Dirsrv Set pods | list (sorted, Running only)
  ansible.builtin.set_fact:
    install_dirsrv_pods_list: >-
      {{
        (install_dirsrv_pods.resources | default([])) | selectattr('status.phase', 'equalto', 'Running') | map(attribute='metadata.name') | sort | list
      }}
  changed_when: false

- name: Dirsrv Assert expected pods are Running
  ansible.builtin.assert:
    that:
      - (install_dirsrv_pods_list | length) >= (expected_replicas | int)
    fail_msg: >-
      Expected at least {{ expected_replicas }} Running pods for app=dirsrv in {{ install_dirsrv_target_namespace }},
      but found {{ install_dirsrv_pods_list | length }}. Check oc describe pod/events.
  changed_when: false

# --------------------------
# Bootstrap (optional): LDIF + ldapadd/idempotent checks
# Requires templates in roles/ dirsrv/templates/
# --------------------------

- name: Dirsrv Ensure suffix backend exists (each pod)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ item }}"
    container: dirsrv-container
    command: |
      sh -lc 'if dsconf localhost backend suffix list 2>/dev/null | grep -Fq "{{ install_dirsrv_ds_suffix_effective }}"; then
        echo "suffix backend already present"
        exit 0
      fi
      dsconf localhost backend create --suffix "{{ install_dirsrv_ds_suffix_effective }}" --be-name "backend-{{ install_dirsrv_target_namespace }}"'
  register: install_dirsrv_backend_create
  failed_when: >-
    (install_dirsrv_backend_create.rc | default(1) | int) != 0
    and ('Mapping tree for this suffix exists' not in (install_dirsrv_backend_create.stderr | default('')))
    and ('already exists' not in (install_dirsrv_backend_create.stderr | default('')))
    and ('Mapping tree for this suffix exists' not in (install_dirsrv_backend_create.stdout | default('')))
    and ('already exists' not in (install_dirsrv_backend_create.stdout | default('')))
    and ('already present' not in (install_dirsrv_backend_create.stdout | default('')))
  changed_when: >-
    (install_dirsrv_backend_create.rc | default(1) | int) == 0
    and ('already present' not in (install_dirsrv_backend_create.stdout | default('')))
  loop: "{{ install_dirsrv_pods_list }}"
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Render LDIF templates locally
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: "suffix.ldif.j2", dest: "suffix.ldif" }
    - { src: "ou-people.ldif.j2", dest: "ou-people.ldif" }
    - { src: "ou-groups.ldif.j2", dest: "ou-groups.ldif" }
    - { src: "test-user.ldif.j2", dest: "test-user.ldif" }
    - { src: "test-group.ldif.j2", dest: "test-group.ldif" }
    - { src: "test-group-member.ldif.j2", dest: "test-group-member.ldif" }
    - { src: "user-groups.ldif.j2", dest: "user-groups.ldif" }
    - { src: "aci-anon-read.ldif.j2", dest: "aci-anon-read.ldif" }
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Push LDIF files into pod-0 /tmp (base64 write)
  vars:
    local_path: "/tmp/{{ item }}"
    pod_path: "/tmp/{{ item }}"
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'printf "%s" "{{ lookup("file", local_path) | b64encode }}" | base64 -d > {{ pod_path }}'
  loop:
    - "suffix.ldif"
    - "ou-people.ldif"
    - "ou-groups.ldif"
    - "test-user.ldif"
    - "test-group.ldif"
    - "test-group-member.ldif"
    - "user-groups.ldif"
    - "aci-anon-read.ldif"
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Ensure suffix root exists (idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    # Keep the shell on one logical line — extra-indented YAML folded lines
    # become real newlines and break ldapsearch argv ("-D: command not found").
    command: >-
      sh -lc 'ldapsearch -x -LLL -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -b "{{ install_dirsrv_ds_suffix_effective }}" -s base "(objectClass=*)" dn >/dev/null 2>&1 || ldapadd -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/suffix.ldif'
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Ensure ou=people exists (idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'ldapsearch -x -LLL -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -b "ou=people,{{ install_dirsrv_ds_suffix_effective }}" -s base "(objectClass=*)" dn >/dev/null 2>&1 || ldapadd -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/ou-people.ldif'
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Ensure ou=groups exists (idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'ldapsearch -x -LLL -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -b "ou=groups,{{ install_dirsrv_ds_suffix_effective }}" -s base "(objectClass=*)" dn >/dev/null 2>&1 || ldapadd -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/ou-groups.ldif'
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Ensure test group exists (idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'ldapsearch -x -LLL -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -b "cn=testgroup,ou=groups,{{ install_dirsrv_ds_suffix_effective }}" -s base "(objectClass=*)" dn >/dev/null 2>&1 || ldapadd -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/test-group.ldif'
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Ensure test user exists (idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'ldapsearch -x -LLL -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -b "uid={{ install_dirsrv_test_user_uid_effective }},ou=people,{{ install_dirsrv_ds_suffix_effective }}" -s base "(objectClass=*)" dn >/dev/null 2>&1 || ldapadd -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/test-user.ldif'
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Ensure test user is member of test group (idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'ldapsearch -x -LLL -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -b "cn=testgroup,ou=groups,{{ install_dirsrv_ds_suffix_effective }}" "(member=uid={{ install_dirsrv_test_user_uid_effective }},ou=people,{{ install_dirsrv_ds_suffix_effective }})" dn >/dev/null 2>&1 || ldapmodify -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/test-group-member.ldif'
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Apply user-groups LDIF (non-fatal; may already exist)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'ldapadd -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/user-groups.ldif || true'
  when: enable_bootstrap | default(true) | bool

# --------------------------
# Replication (optional)
# --------------------------

- name: Dirsrv Enable replication on both pods (supplier role)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ item.pod }}"
    container: dirsrv-container
    command: >-
      sh -lc 'dsconf localhost replication enable --suffix "{{ install_dirsrv_ds_suffix_effective }}" --role supplier --replica-id {{ item.replica_id }} --bind-dn "{{ repl_manager_dn }}" --bind-passwd "{{ install_dirsrv_repl_manager_password_effective }}"'
  register: install_dirsrv_repl_enable
  failed_when: >
    (install_dirsrv_repl_enable.rc != 0) and
    ("already enabled for this suffix" not in (install_dirsrv_repl_enable.stderr | default("")))
  changed_when: >
    (install_dirsrv_repl_enable.rc == 0) and
    ("already enabled for this suffix" not in (install_dirsrv_repl_enable.stderr | default("")))
  loop:
    - { pod: "{{ install_dirsrv_pods_list[0] }}", replica_id: 1 }
    - { pod: "{{ install_dirsrv_pods_list[1] }}", replica_id: 2 }
  when:
    - enable_replication | default(true) | bool
    - (install_dirsrv_pods_list | length) >= 2

- name: Dirsrv Create replication agreement pod-0 -> pod-1 (idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: |
      sh -lc 'set -e
      AGREEMENT="to-pod-1"
      TARGET="{{ install_dirsrv_pods_list[1] }}.dirsrv-internal-svc.{{ install_dirsrv_target_namespace }}.svc.cluster.local"
      dsconf localhost repl-agmt list --suffix "{{ install_dirsrv_ds_suffix_effective }}" | grep -q "$AGREEMENT" && exit 0
      dsconf localhost repl-agmt create --suffix "{{ install_dirsrv_ds_suffix_effective }}" --host "$TARGET" --port {{ ldap_port }} --conn-protocol LDAP --bind-method SIMPLE --bind-dn "{{ repl_manager_dn }}" --bind-passwd "{{ install_dirsrv_repl_manager_password_effective }}" "$AGREEMENT"'
  when:
    - enable_replication | default(true) | bool
    - (install_dirsrv_pods_list | length) >= 2

# --------------------------
# Anonymous bind / ACI
# --------------------------

- name: Dirsrv Enable unauthenticated binds if supported (pod-0)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: |
      sh -lc 'if dsconf localhost config get 2>/dev/null | grep -q "^nsslapd-allow-unauthenticated-binds:"; then
        dsconf localhost config replace nsslapd-allow-unauthenticated-binds=on
      elif dsconf localhost config get 2>/dev/null | grep -q "^nsslapd-allow-unauthenticated-bind:"; then
        dsconf localhost config replace nsslapd-allow-unauthenticated-bind=on
      else
        echo "No unauthenticated-bind setting supported; skipping"
      fi'
  when: enable_bootstrap | default(true) | bool

- name: Dirsrv Apply Anonymous Read ACI on suffix (non-fatal idempotent)
  kubernetes.core.k8s_exec:
    namespace: "{{ install_dirsrv_target_namespace }}"
    pod: "{{ install_dirsrv_pods_list[0] }}"
    container: dirsrv-container
    command: >-
      sh -lc 'ldapmodify -x -H ldap://localhost:{{ ldap_port }} -D "cn=Directory Manager" -w "{{ install_dirsrv_dm_password }}" -f /tmp/aci-anon-read.ldif'
  register: install_dirsrv_aci_apply
  failed_when: >
    (install_dirsrv_aci_apply.rc != 0) and
    ("Type or value exists" not in (install_dirsrv_aci_apply.stderr | default("")))
  changed_when: >
    (install_dirsrv_aci_apply.rc == 0)
  when: enable_bootstrap | default(true) | bool
