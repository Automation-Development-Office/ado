---
# Seed playbook: wire NetBox OIDC to Keycloak RHLAB.
- name: ADO | Configure NetBox OIDC (Keycloak RHLAB)
  hosts: localhost
  gather_facts: false
  collections:
    - infra.ado
  vars:
    component: netbox
    netbox_oidc_state: "{{ state | default('present') }}"
    netbox_oidc_validate_certs: "{{ not (skip_tls_verify | default(true) | bool) }}"
    netbox_oidc_issuer: "{{ netbox_oidc_issuer | default('https://keycloak.apps.ocp.prod.rhlab/realms/rhlab', true) }}"
    netbox_oidc_client_id: "{{ netbox_oidc_client_id | default('netbox', true) }}"
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_netbox.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_netbox.yml"
  environment:
    ANSIBLE_COLLECTIONS_PATH: /runner/project/collections:{{ playbook_dir }}/../../collections
    ANSIBLE_COLLECTIONS_PATHS: /runner/project/collections:{{ playbook_dir }}/../../collections
    K8S_AUTH_HOST: "{{ host | default(api_host) }}"
    K8S_AUTH_API_KEY: "{{ token }}"
    K8S_AUTH_VERIFY_SSL: "{{ (verify_ssl | bool) | ternary('yes', 'no') }}"
  roles:
    - role: "{{ playbook_dir }}/../../collections/ansible_collections/infra/ado/roles/netbox_oidc"
