---
- name: ADO | Manage RHBK client
  hosts: localhost
  gather_facts: false
  vars:
    component: rhbk
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  no_log: false
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Build client work list from rhbk_clients dict when present
      ansible.builtin.set_fact:
        rhbk_client_work_items: >-
          {{
            rhbk_clients | dict2items
            if (rhbk_clients is defined and (rhbk_clients | length) > 0)
            else (
              [{'key': rhbk_client, 'value': {}}]
              if (rhbk_client is defined and (rhbk_client | string | length) > 0)
              else []
            )
          }}
  tasks:
    - name: ADO | Ensure each RHBK client
      ansible.builtin.include_role:
        name: infra.ado.rhbk_client
      vars:
        rhbk_client: "{{ item.key }}"
        rhbk_client_name: "{{ item.value.rhbk_client_name | default(item.value.name | default(item.key)) }}"
        rhbk_description: "{{ item.value.rhbk_description | default(omit) }}"
        rhbk_service_accounts_enabled: "{{ item.value.rhbk_service_accounts_enabled | default(true) }}"
        rhbk_public_client: "{{ item.value.rhbk_public_client | default(false) }}"
        rhbk_redirect_uris: "{{ item.value.rhbk_redirect_uris | default(item.value.redirect_uris | default(omit)) }}"
        rhbk_web_origins: "{{ item.value.rhbk_web_origins | default(item.value.web_origins | default(omit)) }}"
      loop: "{{ rhbk_client_work_items }}"
      loop_control:
        label: "{{ item.key }}"
      when: (rhbk_client_work_items | length) > 0
