---
# Extend Contoller JT component map from the shared system-roles catalog.

- name: Load RHEL system roles catalog for job templates
  ansible.builtin.set_fact:
    bootstrap_controller_rhel_system_roles_catalog: >-
      {{
        (
          lookup(
            'ansible.builtin.file',
            role_path
            ~ '/../bootstrap_generate_playbook_repo/files/rhel_system_roles_catalog.yml'
          )
          | from_yaml
        ).rhel_system_roles_catalog
        | default([])
      }}
  when: bootstrap_controller_rhel_system_roles_catalog is not defined

- name: Init RHEL system roles JT map
  ansible.builtin.set_fact:
    bootstrap_controller_rhel_system_roles_jt_map:
      rhel_system_roles: []

- name: Append each RHEL system role JT map entry
  ansible.builtin.set_fact:
    bootstrap_controller_rhel_system_roles_jt_map: >-
      {{
        bootstrap_controller_rhel_system_roles_jt_map
        | combine({item.app: [item.job_template]}, recursive=False)
      }}
  loop: "{{ bootstrap_controller_rhel_system_roles_catalog }}"
  loop_control:
    label: "{{ item.app }}"

- name: Merge RHEL system roles into Contoller JT component map
  ansible.builtin.set_fact:
    bootstrap_controller_job_template_component_map: >-
      {{
        bootstrap_controller_job_template_component_map
        | combine(bootstrap_controller_rhel_system_roles_jt_map, recursive=False)
      }}
