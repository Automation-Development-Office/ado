---
# yamllint disable rule:line-length
- name: Bootstrap HTPasswd | Assert vault users are present
  ansible.builtin.assert:
    that:
      - htpasswd_users is defined
      - htpasswd_users | length > 0
      - htpasswd_users[0].password | default('') | length > 0
    fail_msg: >-
      admin_htpasswd is selected for bootstrap prep but
      openshift.admin_username / admin_password are empty.

- name: Bootstrap HTPasswd | Create admin HTPasswd identity provider
  ansible.builtin.include_role:
    name: infra.ado.ocp_htpasswd_admin
  vars:
    state: present
    name_space: openshift-config
    htpasswd_idp_name: htpasswd-admin
    htpasswd_secret: htpasswd-admin-secret
    htpasswd_users: "{{ htpasswd_users }}"
    htpasswd_pass: "{{ htpasswd_pass | default(htpasswd_users[0].password) }}"
  environment:
    KUBECONFIG: "{{ bootstrap_controller_openshift_kubeconfig }}"
    K8S_AUTH_KUBECONFIG: "{{ bootstrap_controller_openshift_kubeconfig }}"
