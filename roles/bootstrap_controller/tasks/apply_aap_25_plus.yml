# Create/update projects separately so we can force sync before job templates.
# Never sync during project create: Contoller runs install_collections then and
# fails hard if Hub does not yet have infra.ado (or Hub update was skipped).
- name: AAP 2.5+ | Sanitize controller projects (no sync-on-create)
  ansible.builtin.set_fact:
    bootstrap_controller_projects_sanitized: >-
      {{
        (
          controller_projects
          | default(controller_bootstrap_controller_projects | default([]), true)
        )
        | map('combine', {'update_project': false, 'wait': false})
        | list
      }}

- name: AAP 2.5+ | Normalize controller projects before apply
  ansible.builtin.set_fact:
    controller_projects: "{{ bootstrap_controller_projects_sanitized }}"
    bootstrap_controller_controller_projects: "{{ bootstrap_controller_projects_sanitized }}"
    controller_bootstrap_controller_projects: "{{ bootstrap_controller_projects_sanitized }}"

- name: AAP 2.5+ | Debug controller projects before apply
  ansible.builtin.debug:
    var: controller_projects

- name: AAP 2.5+ | Apply projects
  ansible.builtin.include_role:
    name: infra.aap_configuration.controller_projects
  when: controller_projects | default([]) | length > 0

- name: AAP 2.5+ | Force project sync before creating job templates
  ansible.controller.project_update:
    project: "{{ item.name }}"
    organization: "{{ item.organization | default(controller_bootstrap_organization | default(bootstrap_controller_organization), true) }}"
    wait: true
    timeout: "{{ bootstrap_controller_project_sync_timeout | default(600) }}"
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  loop: "{{ controller_projects | default([]) }}"
  register: bootstrap_controller_project_sync_result
  failed_when: false
  when:
    - controller_projects | default([]) | length > 0
    - item.scm_type | default('') | length > 0

- name: AAP 2.5+ | Collect failed project sync items
  ansible.builtin.set_fact:
    bootstrap_controller_project_sync_failures: >-
      {{
        bootstrap_controller_project_sync_result.results
        | default([])
        | selectattr('status', 'defined')
        | selectattr('status', 'equalto', 'failed')
        | list
      }}
  when:
    - controller_projects | default([]) | length > 0
    - bootstrap_controller_project_sync_result is defined

- name: AAP 2.5+ | Fail with actionable project sync guidance
  ansible.builtin.fail:
    msg: >-
      Contoller project sync failed for:
      {{
        bootstrap_controller_project_sync_failures
        | map(attribute='item.name')
        | list
        | join(', ')
      }}.
      Contoller git project update failed. If Hub collection update was not
      requested, bootstrap should not write collections/requirements.yml and
      should not need Galaxy/Hub. Check the Contoller project update stdout
      (git clone/auth vs leftover Galaxy requirements). Module message:
      {{
        bootstrap_controller_project_sync_failures
        | map(attribute='msg')
        | list
        | join(' | ')
      }}
  when:
    - bootstrap_controller_project_sync_failures | default([]) | length > 0

- name: AAP 2.5+ | Wait for project playbooks to become available
  ansible.builtin.pause:
    seconds: "{{ bootstrap_controller_project_playbook_wait_seconds | default(30) }}"
  when: controller_projects | default([]) | length > 0

