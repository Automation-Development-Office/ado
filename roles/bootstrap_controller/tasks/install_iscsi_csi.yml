---
# yamllint disable rule:line-length
- name: Bootstrap iSCSI CSI | Assert DSM settings are present
  ansible.builtin.assert:
    that:
      - ocp_iscsi_storage_dsm_host | default('') | length > 0
      - ocp_iscsi_storage_dsm_username | default('') | length > 0
      - ocp_iscsi_storage_dsm_password | default('') | length > 0
    fail_msg: >-
      iscsi_csi bootstrap prep requires openshift.iscsi_dsm_host,
      iscsi_dsm_username, and iscsi_dsm_password (or ocp_iscsi_storage_* vars).

- name: Bootstrap iSCSI CSI | Install Synology CSI driver and StorageClass
  ansible.builtin.include_role:
    name: infra.ado.ocp_iscsi_storage
  vars:
    ocp_iscsi_storage_connection: "{{ bootstrap_controller_openshift_connection }}"
    ocp_iscsi_storage_dsm_host: >-
      {{ ocp_iscsi_storage_dsm_host | default(iscsi_dsm_host) }}
    ocp_iscsi_storage_dsm_port: >-
      {{
        ocp_iscsi_storage_dsm_port
        | default(iscsi_dsm_port | default(5000))
      }}
    ocp_iscsi_storage_dsm_https: >-
      {{
        ocp_iscsi_storage_dsm_https
        | default(iscsi_dsm_https | default(false))
      }}
    ocp_iscsi_storage_dsm_username: >-
      {{ ocp_iscsi_storage_dsm_username | default(iscsi_dsm_username) }}
    ocp_iscsi_storage_dsm_password: >-
      {{ ocp_iscsi_storage_dsm_password | default(iscsi_dsm_password) }}
    ocp_iscsi_storage_class_name: >-
      {{
        ocp_iscsi_storage_class_name
        | default(iscsi_storage_class_name | default('synology-iscsi-storage'))
      }}
    ocp_iscsi_storage_location: >-
      {{
        ocp_iscsi_storage_location
        | default(iscsi_location | default('/volume1'))
      }}
    ocp_iscsi_storage_is_default: >-
      {{
        ocp_iscsi_storage_is_default
        | default(iscsi_is_default | default(true))
      }}
    ocp_iscsi_storage_install_snapshotter: >-
      {{
        ocp_iscsi_storage_install_snapshotter
        | default(iscsi_install_snapshotter | default(true))
      }}
  environment:
    KUBECONFIG: "{{ bootstrap_controller_openshift_kubeconfig }}"
    K8S_AUTH_KUBECONFIG: "{{ bootstrap_controller_openshift_kubeconfig }}"
