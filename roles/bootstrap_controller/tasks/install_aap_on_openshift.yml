---
- name: Install AAP on OpenShift | Resolve environment
  ansible.builtin.set_fact:
    bootstrap_controller_aap_install_env: >-
      {{
        bootstrap_controller_generated_env
        | default(env | default(bootstrap_generate_env_vars_env | default('prod'), true), true)
      }}

- name: Install AAP on OpenShift | Load generated AAP install vars
  ansible.builtin.include_vars:
    dir: >-
      {{
        playbook_dir
      }}/group_vars/all/{{ bootstrap_controller_aap_install_env }}
    extensions:
      - yml
      - yaml
  when:
    - >-
      (
        playbook_dir
        + '/group_vars/all/'
        + bootstrap_controller_aap_install_env
      ) is directory

- name: Install AAP on OpenShift | Assert install vars are present
  ansible.builtin.assert:
    that:
      - aap_ocp_install_namespace | default('') | length > 0
      - aap_ocp_install_connection is defined
      - aap_ocp_install_connection is mapping
      - aap_ocp_install_operator is defined
      - aap_ocp_install_platform is defined
    fail_msg: >-
      aap_install_during_bootstrap is enabled but vars_aap.yml install
      settings are missing. Select the OpenShift aap app in preflight and
      regenerate env vars.

- name: Install AAP on OpenShift | Resolve admin credentials
  ansible.builtin.set_fact:
    bootstrap_controller_aap_admin_user: >-
      {{
        aap_admin_user
        | default(aap_ocp_install_platform.admin_user | default('admin'), true)
      }}
    bootstrap_controller_aap_admin_password: >-
      {{
        aap_admin_password
        | default(vault_controller_password | default('', true), true)
      }}
    bootstrap_controller_aap_admin_password_secret: >-
      {{
        aap_ocp_install_platform.admin_password_secret
        | default(
          (aap_ocp_install_platform.instance_name | default('aap'))
          ~ '-admin-password',
          true
        )
      }}

- name: Install AAP on OpenShift | Require admin password for install
  ansible.builtin.assert:
    that:
      - bootstrap_controller_aap_admin_password | length > 0
    fail_msg: >-
      Set component_config.aap.admin_password (or aap.admin_password) in
      preflight before install-during-bootstrap so the operator admin
      secret is deterministic instead of a random operator-generated value.

- name: Install AAP on OpenShift | Resolve OpenShift API connection
  ansible.builtin.set_fact:
    bootstrap_controller_aap_install_k8s_host: >-
      {{ aap_ocp_install_connection.host }}
    bootstrap_controller_aap_install_k8s_api_key: >-
      {{ aap_ocp_install_connection.api_key }}
    bootstrap_controller_aap_install_k8s_validate_certs: >-
      {{ aap_ocp_install_connection.validate_certs | default(false) | bool }}

- name: Install AAP on OpenShift | Ensure namespace exists for admin secret
  kubernetes.core.k8s:
    host: "{{ bootstrap_controller_aap_install_k8s_host }}"
    api_key: "{{ bootstrap_controller_aap_install_k8s_api_key }}"
    validate_certs: "{{ bootstrap_controller_aap_install_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ aap_ocp_install_namespace }}"
  when: aap_ocp_install_create_namespace | default(true) | bool

- name: Install AAP on OpenShift | Create or update admin password secret
  no_log: true
  kubernetes.core.k8s:
    host: "{{ bootstrap_controller_aap_install_k8s_host }}"
    api_key: "{{ bootstrap_controller_aap_install_k8s_api_key }}"
    validate_certs: "{{ bootstrap_controller_aap_install_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ bootstrap_controller_aap_admin_password_secret }}"
        namespace: "{{ aap_ocp_install_namespace }}"
      type: Opaque
      stringData:
        password: "{{ bootstrap_controller_aap_admin_password }}"

- name: Install AAP on OpenShift | Attach admin credentials to platform install vars
  ansible.builtin.set_fact:
    aap_ocp_install_platform: >-
      {{
        aap_ocp_install_platform
        | combine(
          {
            'admin_user': bootstrap_controller_aap_admin_user,
            'admin_password_secret': bootstrap_controller_aap_admin_password_secret
          },
          recursive=true
        )
      }}
    aap_ocp_install_controller: >-
      {{
        (aap_ocp_install_controller | default({}))
        | combine({'admin_user': bootstrap_controller_aap_admin_user}, recursive=true)
      }}

- name: Install AAP on OpenShift | Run installer role
  ansible.builtin.include_role:
    name: infra.ado.aap_ocp_install
