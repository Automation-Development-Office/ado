---
controller_templates:
  - name: ADO | Configure NetBox OIDC
    description: >-
      Bootstrap - Wire NetBox Helm to Keycloak OIDC (RHLAB realm).
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/netbox/ado-configure-netbox-oidc-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | netbox
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | oidc
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Configure NetBox OIDC Survey
      description: NetBox → Keycloak RHLAB
      spec:
        - question_name: ADO | Do you want to install or remove?
          required: true
          type: multiplechoice
          variable: state
          choices: '{{ bootstrap_controller_state_choices }}'
          default: '{{ bootstrap_controller_default_state }}'
        - question_name: ADO | What environment?
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | OIDC issuer URL
          required: false
          type: text
          variable: netbox_oidc_issuer
          default: ''
        - question_name: ADO | OIDC client ID
          required: true
          type: text
          variable: netbox_oidc_client_id
          default: netbox
        - question_name: ADO | OIDC client secret
          required: true
          type: password
          variable: netbox_oidc_client_secret
          default: ''
