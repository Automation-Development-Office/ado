---
controller_templates:
  - name: ADO | Install AAP on RHEL
    description: Bootstrap - Install AAP on RHEL via infra.aap_utilities aap_setup_*
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/aap/ado-aap-rhel-install-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | aap
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Install AAP on RHEL Survey
      description: Select the generated environment containing AAP setup inventory vars
      spec:
        - question_name: ADO | What environment?
          question_description: Target generated environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
