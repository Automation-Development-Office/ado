---
controller_templates:
  - name: ADO | ACS RHACS Vulnerability Report
    description: >-
      Bootstrap - Generate RHACS vulnerability reports (raw / rhsource / age / all)
      from ACS Central workload export
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/acs/ado-acs-report.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | acs
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | ACS RHACS Report Survey
      description: Report mode and scope options for RHACS Central export
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault_acs / vars_acs)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Report mode
          question_description: >-
            raw=all sources; rhsource=Red Hat CVE/errata only; age=age buckets;
            all=scrubbed full CSV
          required: true
          type: multiplechoice
          variable: acs_report_mode
          choices: "rhsource\nraw\nage\nall"
          default: rhsource
        - question_name: ADO | Expand all product groups?
          question_description: >-
            With raw/rhsource, include all product groups (script --all scope).
            Ignored when mode is all (CSV).
          required: true
          type: multiplechoice
          variable: acs_report_all_scope
          choices: "false\ntrue"
          default: "false"
        - question_name: ADO | ROSA/SRE responsibility only?
          question_description: Limit to core OpenShift platform (--rhsre)
          required: true
          type: multiplechoice
          variable: acs_report_rhsre
          choices: "false\ntrue"
          default: "false"
        - question_name: ADO | Show Critical/High columns?
          question_description: Add severity columns to Slack table (--sev)
          required: true
          type: multiplechoice
          variable: acs_report_show_sev
          choices: "false\ntrue"
          default: "true"
        - question_name: ADO | Component filter (optional)
          question_description: >-
            Limit to one group alias: acm, devspaces, cert-manager,
            web-terminal, gitops, compliance, kube-descheduler,
            cluster-logging, rhacs. Leave blank for all selected groups.
          required: false
          type: text
          variable: acs_report_component
          default: ""
