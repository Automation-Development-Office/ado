---
controller_templates:
  - name: ADO | Manage VPN Access
    description: >-
      Approve or deny ADO Cluster Portal lab VPN requests — create IdM + UniFi
      accounts and email the requester (or send denial).
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/vpn/ado-manage-vpn-access-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | vpn
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | portal
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ADO | Manage VPN Access
      description: Portal-driven approve/deny for lab VPN and IdM access
      spec:
        - question_name: Action
          question_description: approve creates accounts + emails creds; deny emails denial
          required: true
          type: multiplechoice
          variable: action
          choices:
            - approve
            - deny
          default: approve
        - question_name: Environment
          question_description: Selects group_vars vault_idm / optional vault_unifi
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: Requester email
          required: true
          type: text
          variable: email
          default: ''
        - question_name: Username
          required: true
          type: text
          variable: username
          default: ''
        - question_name: Display name
          required: false
          type: text
          variable: display_name
          default: ''
        - question_name: Access profile
          required: true
          type: multiplechoice
          variable: profile
          choices:
            - lab-access
            - developer
            - observability
            - cluster-admin
            - network-admin
          default: lab-access
        - question_name: Request / business reason
          required: false
          type: textarea
          variable: reason
          default: ''
        - question_name: Deny reason (deny only)
          required: false
          type: textarea
          variable: deny_reason
          default: Your lab / VPN access request was denied.
        - question_name: Actor (approver)
          required: false
          type: text
          variable: actor
          default: portal
        - question_name: Portal request ID
          required: false
          type: text
          variable: request_id
          default: ''
