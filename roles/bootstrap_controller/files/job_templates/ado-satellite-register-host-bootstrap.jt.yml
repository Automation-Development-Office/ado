---
controller_templates:
  - name: ADO | Register Host to Satellite
    description: Bootstrap - Register RHEL host to Satellite (sat.server.lab)
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/satellite/ado-register-to-satellite-bootstrap.yml
    inventory: '{{ bootstrap_controller_rhel_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
      - '{{ bootstrap_controller_machine_credential | default(bootstrap_controller_organization ~ "-machine") }}'
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    ask_limit_on_launch: true
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | satellite
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Register Host to Satellite Survey
      description: Satellite registration inputs
      spec:
        - question_name: ADO | Do you want to install or remove?
          question_description: Register (present) or deregister (absent)
          required: true
          type: multiplechoice
          variable: state
          choices: '{{ bootstrap_controller_state_choices }}'
          default: '{{ bootstrap_controller_default_state }}'
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
