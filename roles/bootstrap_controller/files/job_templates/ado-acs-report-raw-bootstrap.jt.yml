---
controller_templates:
  - name: ADO | ACS RHACS Report (Raw)
    description: >-
      Bootstrap - RHACS Critical+Important fixable findings from all
      vulnerability sources (--raw --sev)
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/acs/ado-acs-report.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | acs
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars:
      acs_report_mode: raw
      acs_report_show_sev: true
      acs_report_all_scope: false
      acs_report_rhsre: false
    survey_enabled: true
    survey_spec:
      name: ADO | ACS RHACS Report (Raw)
      description: Environment for all-sources vulnerability report
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault_acs / vars_acs)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Component filter (optional)
          question_description: >-
            Limit to one group alias: acm, devspaces, cert-manager,
            web-terminal, gitops, compliance, kube-descheduler,
            cluster-logging, rhacs. Leave blank for all selected groups.
          required: false
          type: text
          variable: acs_report_component
          default: ""
