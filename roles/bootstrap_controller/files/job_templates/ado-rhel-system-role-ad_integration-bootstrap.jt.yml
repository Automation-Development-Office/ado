---
controller_templates:
  - name: ADO | RHEL System Role | ad_integration
    description: Bootstrap - Apply redhat.rhel_system_roles.ad_integration
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/rhel_system_roles/ado-system-role-ad_integration-bootstrap.yml
    inventory: '{{ bootstrap_controller_rhel_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | rhel_system_roles
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | rhel
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | RHEL System Role | ad_integration Survey
      description: Select environment for redhat.rhel_system_roles.ad_integration
      spec:
        - question_name: ADO | What environment?
          question_description: Target generated environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
