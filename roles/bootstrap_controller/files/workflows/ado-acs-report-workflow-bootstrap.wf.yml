---
controller_workflow_job_templates:
  - name: ADO | ACS RHACS Report Workflow
    description: >-
      Bootstrap workflow - generate Red Hat source, raw, and age RHACS
      vulnerability reports in sequence
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | acs
    simplified_workflow_nodes:
      - identifier: RHACS Report Red Hat Source
        unified_job_template: ADO | ACS RHACS Report (Red Hat Source)
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - RHACS Report Raw

      - identifier: RHACS Report Raw
        unified_job_template: ADO | ACS RHACS Report (Raw)
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - RHACS Report Age

      - identifier: RHACS Report Age
        unified_job_template: ADO | ACS RHACS Report (Age)
        lookup_organization: "{{ bootstrap_controller_organization }}"
