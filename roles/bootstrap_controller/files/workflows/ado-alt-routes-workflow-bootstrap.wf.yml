---
controller_workflow_job_templates:
  - name: ADO | Alt Routes Workflow
    description: >-
      Optional OpenShift alternate-route steps — print candidates, create alt
      routes, or bind routes to a named ingress controller based on preflight
      Alternate Routes options.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | openshift
    simplified_workflow_nodes:
      - identifier: Print Alternate Routes
        unified_job_template: ADO | Print Alternate Routes
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Add Alternate Routes

      - identifier: Add Alternate Routes
        unified_job_template: ADO | Add Alternate Routes
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Add Ingress with Route

      - identifier: Add Ingress with Route
        unified_job_template: ADO | Add Ingress with Route
        lookup_organization: "{{ bootstrap_controller_organization }}"
