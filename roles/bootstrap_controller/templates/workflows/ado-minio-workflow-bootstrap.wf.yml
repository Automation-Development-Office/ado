---
controller_workflow_job_templates:
  - name: ADO | MinIO Workflow
    description: >-
      MinIO on OpenShift — install (or configure) then optional auth step
      based on preflight MinIO options.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | minio
    simplified_workflow_nodes:
      - identifier: Deploy MinIO
        unified_job_template: ADO | Deploy MinIO
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy MinIO OIDC

      - identifier: Deploy MinIO OIDC
        unified_job_template: ADO | Deploy MinIO OIDC
        lookup_organization: "{{ bootstrap_controller_organization }}"
