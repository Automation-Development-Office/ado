---
controller_workflow_job_templates:
  - name: ADO | Dev Hub Workflow
    description: >-
      Dev Hub on OpenShift — install (or configure) then optional auth step
      based on preflight Dev Hub options.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | dev-hub
    simplified_workflow_nodes:
      - identifier: Deploy Dev Hub
        unified_job_template: ADO | Deploy Dev Hub
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Dev Hub OIDC

      - identifier: Deploy Dev Hub OIDC
        unified_job_template: ADO | Deploy Dev Hub OIDC
        lookup_organization: "{{ bootstrap_controller_organization }}"
