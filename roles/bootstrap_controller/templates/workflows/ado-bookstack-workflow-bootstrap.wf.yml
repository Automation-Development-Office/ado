---
controller_workflow_job_templates:
  - name: ADO | BookStack Workflow
    description: >-
      BookStack on OpenShift — install (or configure) then optional auth step
      based on preflight BookStack options.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | bookstack
    simplified_workflow_nodes:
      - identifier: Deploy BookStack
        unified_job_template: ADO | Deploy BookStack
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy BookStack OIDC

      - identifier: Deploy BookStack OIDC
        unified_job_template: ADO | Deploy BookStack OIDC
        lookup_organization: "{{ bootstrap_controller_organization }}"
