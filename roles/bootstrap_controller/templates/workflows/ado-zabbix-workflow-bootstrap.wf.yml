---
controller_workflow_job_templates:
  - name: ADO | Zabbix Workflow
    description: >-
      Zabbix on OpenShift — install then optional SAML SSO when selected.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | zabbix
    simplified_workflow_nodes:
      - identifier: Deploy Zabbix
        unified_job_template: ADO | Deploy Zabbix
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Configure Zabbix SAML

      - identifier: Configure Zabbix SAML
        unified_job_template: ADO | Configure Zabbix SAML
        lookup_organization: "{{ bootstrap_controller_organization }}"
