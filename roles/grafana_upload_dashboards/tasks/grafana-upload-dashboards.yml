---
# Supports legacy grafana_dashboards list and multi-folder grafana_folders entries.
# Files ending in .json.j2 are templated; plain .json files are uploaded as-is.

- name: Normalize dashboard sources from grafana_folders
  ansible.builtin.set_fact:
    grafana_upload_dashboards_work_items: []

- name: Build work items from grafana_folders
  ansible.builtin.include_tasks: collect-folder-dashboards.yml
  loop: "{{ grafana_folders | default([]) }}"
  loop_control:
    loop_var: grafana_folder_item
  when: (grafana_folders | default([]) | length) > 0

- name: Fall back to legacy grafana_dashboards list
  ansible.builtin.set_fact:
    grafana_upload_dashboards_work_items: "{{ grafana_dashboards | default([]) }}"
  when:
    - (grafana_folders | default([]) | length) == 0
    - (grafana_dashboards | default([]) | length) > 0

- name: Render or copy each dashboard into /tmp
  ansible.builtin.include_tasks: materialize-dashboard.yml
  loop: "{{ grafana_upload_dashboards_work_items }}"
  loop_control:
    loop_var: grafana_dashboard_item
    label: "{{ grafana_dashboard_item.name | default(grafana_dashboard_item.path | default('dashboard')) }}"

- name: Import Grafana dashboards
  grafana.grafana.dashboard:
    grafana_url: "https://{{ grafana_hostname }}"
    grafana_api_key: "{{ grafana_api_key }}"
    state: "{{ state | default('present') }}"
    folder: "{{ grafana_dashboard_item.folder | default(grafana_folder | default(omit)) }}"
    dashboard: "{{ grafana_dashboard_payload }}"
  loop: "{{ grafana_upload_dashboards_work_items }}"
  loop_control:
    loop_var: grafana_dashboard_item
    label: "{{ grafana_dashboard_item.name | default('dashboard') }}"
  vars:
    rendered_dashboard_json: >-
      {{
        lookup(
          'ansible.builtin.file',
          '/tmp/grafana-dashboards/%s.json' | format(grafana_dashboard_item.name)
        ) | from_json
      }}
    grafana_dashboard_payload: >-
      {{
        rendered_dashboard_json
        if (rendered_dashboard_json.dashboard is defined)
        else {
          'dashboard': rendered_dashboard_json,
          'overwrite': true,
          'message': 'Updated by Ansible'
        }
      }}
  when: (grafana_upload_dashboards_work_items | length) > 0
