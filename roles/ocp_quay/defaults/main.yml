---
# defaults file for ocp_quay

state: present
name_space: quay-enterprise
ocp_quay_hostname: "{{ quay_hostname | default(hostname | default('')) }}"
ocp_quay_admin_user: "{{ quay_admin_user | default('quayadmin') }}"
ocp_quay_admin_password: "{{ quay_admin_password | default('redhat123') }}"
ocp_quay_config_secret: "{{ quay_config_secret | default('quay-config-secret') }}"
storage_size: 10Gi
storage: ""
postgres_image: registry.redhat.io/rhel9/postgresql-15:latest

# Keycloak OIDC (lab default: on; secret fetched via ocp_rhbk_client_secrets)
quay_oidc_enabled: true
quay_oidc_client_id: quay
quay_oidc_service_id: keycloak
quay_oidc_service_name: Keycloak
quay_keycloak_realm: "{{ rhbk_realm | default(ocp_rhbk_realm | default('rhlab')) }}"
quay_oidc_issuer_url: ""
quay_oidc_client_secret: ""
quay_oidc_configure_after_install: true
quay_oidc_ca_secret: quay-oidc-ca
quay_oidc_ca_pem: ""
