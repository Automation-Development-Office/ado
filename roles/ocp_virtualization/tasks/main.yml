---
# Dispatch to create_vm.yml (async DV + Multus bridge). Do not keep the old
# kubevirt_vm wait=true path in this file — Contoller was still using it.
- name: Ensure required variables are defined
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - vm_name | length > 0
      - vm_namespace is defined
      - vm_namespace | length > 0
      - source_name is defined
      - source_name | length > 0
      - storage_class is defined
      - storage_class | length > 0
    fail_msg: >
      One or more required variables are missing.
      Please provide vm_name, vm_namespace, storage_class, and source_name.

- name: Create OpenShift Virtualization VM
  ansible.builtin.include_tasks: create_vm.yml
  when: (vm_state | default('present')) == 'present'

- name: Delete VirtualMachine and root DataVolume
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ vm_namespace }}"
  loop:
    - {api: kubevirt.io/v1, kind: VirtualMachine, name: "{{ vm_name }}"}
    - {api: cdi.kubevirt.io/v1beta1, kind: DataVolume, name: "{{ vm_name }}-rootdisk"}
    - {api: cdi.kubevirt.io/v1beta1, kind: DataVolume, name: "{{ vm_name }}-datavolume"}
  when: (vm_state | default('present')) == 'absent'
