---
- name: Skip LDAP user mappers when list is empty
  ansible.builtin.meta: end_host
  when: (ldap_user_mappers | default([]) | length) == 0

- name: Login to RHBK and get admin token for LDAP user mappers
  ansible.builtin.uri:
    url: "{{ rhbk_keycloak_base_url | default('https://' ~ rhbk_host) }}/realms/master/protocol/openid-connect/token"
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ rhbk_admin_user }}"
      password: "{{ rhbk_admin_password }}"
    validate_certs: "{{ rhbk_verify_ssl }}"
    return_content: true
  register: rhbk_setup_mapper_auth

- name: Get LDAP Federation Component list
  ansible.builtin.uri:
    url: "{{ rhbk_keycloak_base_url | default('https://' ~ rhbk_host) }}/admin/realms/{{ rhbk_realm }}/components?type=org.keycloak.storage.UserStorageProvider"
    method: GET
    headers:
      Authorization: "Bearer {{ rhbk_setup_mapper_auth.json.access_token }}"
    return_content: true
    validate_certs: "{{ rhbk_verify_ssl }}"
  register: rhbk_setup_mapper_ldap_components

- name: Extract LDAP federation component ({{ rhbk_federation_name }})
  ansible.builtin.set_fact:
    rhbk_setup_mapper_idm_component_obj: >-
      {{
        rhbk_setup_mapper_ldap_components.json
        | selectattr('name', 'equalto', rhbk_federation_name)
        | list
        | first | default({})
      }}

- name: Set the rhbk_setup_mapper_ldap_component_id
  ansible.builtin.set_fact:
    rhbk_setup_mapper_ldap_component_id: "{{ rhbk_setup_mapper_idm_component_obj.id | default('') }}"

- name: Fail when LDAP federation component was not found
  ansible.builtin.fail:
    msg: >-
      LDAP federation component '{{ rhbk_federation_name }}' was not found in realm
      '{{ rhbk_realm }}'. Create federation before LDAP user mappers.
  when: rhbk_setup_mapper_ldap_component_id | length == 0

- name: Get all existing LDAP mappers for component
  ansible.builtin.uri:
    url: >-
      {{ rhbk_keycloak_base_url | default('https://' ~ rhbk_host) }}/admin/realms/{{ rhbk_realm }}/components?parent={{
      rhbk_setup_mapper_ldap_component_id }}&type=org.keycloak.storage.ldap.mappers.LDAPStorageMapper
    method: GET
    headers:
      Authorization: "Bearer {{ rhbk_setup_mapper_auth.json.access_token }}"
    return_content: true
    validate_certs: "{{ rhbk_verify_ssl }}"
  register: rhbk_setup_mapper_ldap_mappers

- name: Create LDAP user attribute mappers when missing
  ansible.builtin.include_tasks: rhbk_create_one_ldap_user_mapper.yml
  loop: "{{ ldap_user_mappers }}"
  loop_control:
    loop_var: ldap_user_mapper
    label: "{{ ldap_user_mapper.name }}"
