---
# tasks file for sat_reg

- name: Assert required Satellite registration variables
  ansible.builtin.assert:
    that:
      - rhel_sat_reg_org_admin_account | length > 0
      - rhel_sat_reg_org_admin_account_password | length > 0
      - rhel_sat_reg_activation_key_name | length > 0
      - rhel_sat_reg_satellite_org_name | length > 0
      - rhel_sat_reg_satellite_host | length > 0
    fail_msg: >-
      rhel_sat_reg requires Satellite API credentials, organization, host URL,
      and a client activation key. Set rhel_sat_reg_* or ensure vars_satellite.yml
      provides satellite_config_* / satellite_activation_key from preflight
      (component_config.satellite.activation_key).
  when: rhel_sat_reg_action == "register"

- name: Importing registration tasks
  ansible.builtin.import_tasks: reg_to_sat.yml
  when: rhel_sat_reg_action == "register"

- name: Importing deregistration tasks
  ansible.builtin.import_tasks: deregister_from_sat.yml
  when: rhel_sat_reg_action == "deregister"
