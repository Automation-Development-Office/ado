---
# yamllint disable rule:line-length
- name: Iscsi CSI | Resolve OpenShift connection kwargs
  ansible.builtin.set_fact:
    ocp_iscsi_storage_k8s_auth: >-
      {{
        {}
        | combine(
          {'host': ocp_iscsi_storage_connection.host}
          if (ocp_iscsi_storage_connection.host | default('') | length > 0)
          else {},
          recursive=true
        )
        | combine(
          {'api_key': ocp_iscsi_storage_connection.api_key}
          if (ocp_iscsi_storage_connection.api_key | default('') | length > 0)
          else {},
          recursive=true
        )
        | combine(
          {'kubeconfig': ocp_iscsi_storage_connection.kubeconfig}
          if (ocp_iscsi_storage_connection.kubeconfig | default('') | length > 0)
          else {},
          recursive=true
        )
        | combine(
          {
            'validate_certs': ocp_iscsi_storage_connection.validate_certs
            | default(true)
            | bool
          }
          if (
            ocp_iscsi_storage_connection.host is defined
            or ocp_iscsi_storage_connection.kubeconfig is defined
          )
          else {},
          recursive=true
        )
      }}

- name: Iscsi CSI | Assert DSM credentials and StorageClass name are set
  ansible.builtin.assert:
    that:
      - ocp_iscsi_storage_dsm_host | default('') | length > 0
      - ocp_iscsi_storage_dsm_username | default('') | length > 0
      - ocp_iscsi_storage_dsm_password | default('') | length > 0
      - ocp_iscsi_storage_class_name | default('') | length > 0
      - ocp_iscsi_storage_namespace | default('') | length > 0
    fail_msg: >-
      ocp_iscsi_storage_dsm_host, _username, _password, _class_name, and
      _namespace are required.

- name: Iscsi CSI | Ensure synology-csi namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp_iscsi_storage_namespace }}"
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Create client-info-secret from DSM credentials
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: client-info-secret
        namespace: "{{ ocp_iscsi_storage_namespace }}"
      type: Opaque
      stringData:
        client-info.yml: >-
          {{
            lookup(
              'ansible.builtin.template',
              'client-info.yml.j2'
            )
          }}
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Apply OpenShift SCC for CSI service accounts
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/synology-csi-scc.yml"
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Apply CSI controller manifests
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/controller.yml"
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Apply CSIDriver
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/csi-driver.yml"
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Apply CSI node DaemonSet manifests
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/node.yml"
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Apply StorageClass
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{
        lookup(
          'ansible.builtin.template',
          'storageclass.yaml.j2'
        ) | from_yaml
      }}
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Apply snapshotter
  when: ocp_iscsi_storage_install_snapshotter | bool
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/snapshotter.yml"
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"

- name: Iscsi CSI | Apply VolumeSnapshotClass
  when: ocp_iscsi_storage_install_snapshotter | bool
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/volume-snapshot-class.yml"
    host: "{{ ocp_iscsi_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_iscsi_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_iscsi_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_iscsi_storage_k8s_auth.validate_certs | default(omit) }}"
