                rhn_org = first_present(public_values.get("standalone_rhn_org_id"))
                if rhn_org:
                    vars_data["install_grafana_rhn_org_id"] = str(rhn_org)
                rhn_key = first_present(secret_values.get("standalone_rhn_activation_key"))
