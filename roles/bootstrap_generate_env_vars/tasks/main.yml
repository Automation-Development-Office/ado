---
- name: Load preflight JSON input
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_preflight: >-
      {{ lookup('ansible.builtin.file', preflight_json) | from_json }}
  when:
    - preflight_json is defined
    - preflight_json | length > 0

# yamllint disable rule:line-length
- name: Set values from preflight JSON
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_env: >-
      {{
        bootstrap_generate_env_vars_preflight.environment
        | default('prod')
      }}
    bootstrap_generate_env_vars_base_domain: >-
      {{
        bootstrap_generate_env_vars_preflight.domain
        | default('prod.rhlab')
      }}
    bootstrap_generate_env_vars_component: >-
      {{
        bootstrap_generate_env_vars_preflight.component
        | default('all')
      }}
    bootstrap_generate_env_vars_platform: >-
      {{
        (
          bootstrap_generate_env_vars_preflight.platform
          | default([])
          | first
          | default('all', true)
        )
        | lower
      }}
    bootstrap_generate_env_vars_components: >-
      {{
        (
          bootstrap_generate_env_vars_preflight.components
          | default(bootstrap_generate_env_vars_preflight.platform | default([]))
          | map('lower')
          | list
        )
        if (
          bootstrap_generate_env_vars_preflight.components is defined
          or bootstrap_generate_env_vars_preflight.component_apps is defined
        )
        else (
          bootstrap_generate_env_vars_preflight.selected_component_apps
          if (
            bootstrap_generate_env_vars_preflight.selected_component_apps
            is defined
            and bootstrap_generate_env_vars_preflight.selected_component_apps
            | length > 0
          )
          else (
            bootstrap_generate_env_vars_preflight.platform | default(['all'])
          )
        )
        | reject('equalto', '')
        | unique
        | list
      }}
    bootstrap_generate_env_vars_use_aap: >-
      {{
        (
          bootstrap_generate_env_vars_preflight.aap
          | default({})
        ).enabled
        | default(true)
        | bool
      }}
    bootstrap_generate_env_vars_enable_jira: >-
      {{
        (
          bootstrap_generate_env_vars_preflight.jira
          | default({})
        ).enabled
        | default(false)
        | bool
      }}
  when: bootstrap_generate_env_vars_preflight is defined
# yamllint enable rule:line-length

# yamllint disable rule:line-length
- name: Prefer component app selections over stale selected_component_apps
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          ['openshift', 'keycloak', 'satellite', 'grafana', 'jira', 'patching']
          if 'all' in bootstrap_generate_env_vars_preflight_components
          else (
            (
              ['openshift']
              if 'openshift' in bootstrap_generate_env_vars_preflight_components
              else []
            )
            +
            (
              (
                bootstrap_generate_env_vars_preflight.component_apps.openshift
                | default([])
              )
              if 'openshift' in bootstrap_generate_env_vars_preflight_components
              else []
            )
            +
            (
              (
                bootstrap_generate_env_vars_preflight.component_apps.rhel
                | default([])
              )
              if 'rhel' in bootstrap_generate_env_vars_preflight_components
              else []
            )
            +
            (
              (
                bootstrap_generate_env_vars_preflight.component_apps.patching
                | default([])
              )
              if 'patching' in bootstrap_generate_env_vars_preflight_components
              else []
            )
            +
            (
              (
                bootstrap_generate_env_vars_preflight.component_apps.aws
                | default([])
              )
              if 'aws' in bootstrap_generate_env_vars_preflight_components
              else []
            )
            +
            (
              (
                bootstrap_generate_env_vars_preflight.component_apps.provision
                | default([])
              )
              if 'provision' in bootstrap_generate_env_vars_preflight_components
              else []
            )
            +
            (
              ['admin_htpasswd']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and (
                  'admin_htpasswd' in (
                    bootstrap_generate_env_vars_preflight.component_options.openshift
                    | default([])
                  )
                  or (
                    bootstrap_generate_env_vars_preflight_openshift.admin_username
                    is defined
                  )
                  or (
                    bootstrap_generate_env_vars_preflight_openshift.admin_password
                    is defined
                  )
                )
              )
              else []
            )
            +
            (
              ['nfs_csi']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and 'nfs_csi' in (
                  bootstrap_generate_env_vars_preflight.component_options.openshift
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['iscsi_csi']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and 'iscsi_csi' in (
                  bootstrap_generate_env_vars_preflight.component_options.openshift
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['console']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and (
                  'console_banner' in (
                    bootstrap_generate_env_vars_preflight.component_options.openshift
                    | default([])
                  )
                  or (
                    bootstrap_generate_env_vars_preflight_openshift.banner_text
                    is defined
                  )
                )
              )
              else []
            )
            +
            (
              ['openshift_ldap_auth']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and 'ldap_auth' in (
                  bootstrap_generate_env_vars_preflight.component_options.openshift
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['openshift_oauth_rhbk']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and 'oauth_rhbk' in (
                  bootstrap_generate_env_vars_preflight.component_options.openshift
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['openshift_discover_routes_print']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and 'discover_routes_print' in (
                  bootstrap_generate_env_vars_preflight.component_options.openshift
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['openshift_discover_routes_alt']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and 'discover_routes_alt' in (
                  bootstrap_generate_env_vars_preflight.component_options.openshift
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['openshift_update_pull_secret']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and 'update_pull_secret' in (
                  bootstrap_generate_env_vars_preflight.component_options.openshift
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['rhbk_realm']
              if (
                bootstrap_generate_env_vars_preflight_rhbk_selected
                and 'realm' in (
                  bootstrap_generate_env_vars_preflight.component_options.rhbk
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['rhbk_client']
              if (
                bootstrap_generate_env_vars_preflight_rhbk_selected
                and 'client' in (
                  bootstrap_generate_env_vars_preflight.component_options.rhbk
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['rhbk_idp']
              if (
                bootstrap_generate_env_vars_preflight_rhbk_selected
                and 'idp' in (
                  bootstrap_generate_env_vars_preflight.component_options.rhbk
                  | default([])
                )
              )
              else []
            )
            +
            (
              ['rhbk_federation']
              if (
                bootstrap_generate_env_vars_preflight_rhbk_selected
                and 'federation' in (
                  bootstrap_generate_env_vars_preflight.component_options.rhbk
                  | default([])
                )
              )
              else []
            )
            +
            (
              bootstrap_generate_env_vars_preflight_components
              | difference(['openshift', 'rhel', 'patching', 'provision', 'aws'])
              | list
            )
          )
        )
        | reject('equalto', '')
        | unique
        | list
      }}
  vars:
    bootstrap_generate_env_vars_preflight_components: >-
      {{
        bootstrap_generate_env_vars_preflight.components
        | default(bootstrap_generate_env_vars_preflight.platform | default([]))
        | map('lower')
        | list
      }}
    bootstrap_generate_env_vars_preflight_component_apps: >-
      {{ bootstrap_generate_env_vars_preflight.component_apps | default({}) }}
    bootstrap_generate_env_vars_preflight_component_options: >-
      {{
        bootstrap_generate_env_vars_preflight.component_options
        | default({})
      }}
    bootstrap_generate_env_vars_preflight_openshift: >-
      {{ bootstrap_generate_env_vars_preflight.openshift | default({}) }}
    bootstrap_generate_env_vars_preflight_rhbk_selected: >-
      {{
        'rhbk' in bootstrap_generate_env_vars_preflight_components
        or 'rhbk' in (
          bootstrap_generate_env_vars_preflight_component_apps.openshift
          | default([])
        )
      }}
  when:
    - bootstrap_generate_env_vars_preflight is defined
    - >-
      (
        bootstrap_generate_env_vars_preflight_component_apps.openshift
        | default([])
        | length > 0
      )
      or (
        bootstrap_generate_env_vars_preflight_component_apps.rhel
        | default([])
        | length > 0
      )
      or (
        bootstrap_generate_env_vars_preflight_component_apps.patching
        | default([])
        | length > 0
      )
      or (
        bootstrap_generate_env_vars_preflight_component_apps.provision
        | default([])
        | length > 0
      )
      or (
        bootstrap_generate_env_vars_preflight_component_options.openshift
        | default([])
        | length > 0
      )
      or (
        bootstrap_generate_env_vars_preflight_component_options.rhbk
        | default([])
        | length > 0
      )
# yamllint enable rule:line-length

- name: Preserve top-level preflight components with no child selections
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          bootstrap_generate_env_vars_components
          + (
              ['openshift']
              if (
                'openshift' in bootstrap_generate_env_vars_preflight_components
                and (
                  bootstrap_generate_env_vars_preflight.component_apps.openshift
                  | default([])
                  | length
                ) == 0
              )
              else []
            )
          + (
              ['rhel']
              if (
                'rhel' in bootstrap_generate_env_vars_preflight_components
                and (
                  bootstrap_generate_env_vars_preflight.component_apps.rhel
                  | default([])
                  | length
                ) == 0
              )
              else []
            )
          + (
              ['patching']
              if (
                'patching' in bootstrap_generate_env_vars_preflight_components
                and (
                  bootstrap_generate_env_vars_preflight.component_apps.patching
                  | default([])
                  | length
                ) == 0
              )
              else []
            )
          + (
              ['provision']
              if (
                'provision' in bootstrap_generate_env_vars_preflight_components
                and (
                  bootstrap_generate_env_vars_preflight.component_apps.provision
                  | default([])
                  | length
                ) == 0
              )
              else []
            )
        )
        | unique
        | list
      }}
  vars:
    bootstrap_generate_env_vars_preflight_components: >-
      {{
        bootstrap_generate_env_vars_preflight.components
        | default(bootstrap_generate_env_vars_preflight.platform | default([]))
        | map('lower')
        | list
      }}
  when:
    - bootstrap_generate_env_vars_preflight is defined

- name: Add components implied by RHEL options from preflight JSON
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          bootstrap_generate_env_vars_components
          +
          (
            ['compliance']
            if 'compliance' in
              (
                bootstrap_generate_env_vars_preflight.component_options.rhel
                | default([])
                | map('lower')
                | list
              )
            else []
          )
          +
          (
            ['stig']
            if 'stig' in
              (
                bootstrap_generate_env_vars_preflight.component_options.rhel
                | default([])
                | map('lower')
                | list
              )
            else []
          )
        )
        | unique
        | list
      }}
  when:
    - bootstrap_generate_env_vars_preflight is defined

- name: Validate env was provided
  ansible.builtin.assert:
    that:
      - env is defined
      - env | string | length > 0
    fail_msg: |
      Environment must be provided.

      Example:
      ansible-playbook -c local -i inventory run-ado-scaffolding.yml \
        -e env=prod \
        --vault-password-file ~/.vault_pass

- name: Set internal env variable from provided env
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_env: "{{ env }}"

- name: Set environment directory
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_env_dir: >-
      {{
        (bootstrap_generate_env_vars_base_dir
         | default(generate_env_vars_base_dir | default('group_vars/all')))
      }}/{{ bootstrap_generate_env_vars_env }}

- name: Ask whether to create/update repo directories
  ansible.builtin.pause:
    prompt: >-
        Create/update generated bootstrap repository files and
        directory structure? [Y/n]
  register: bootstrap_generate_env_vars_prompt_create_dirs
  when: bootstrap_generate_env_vars_preflight is not defined

- name: Set create dirs answer interactive
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_create_dirs: >-
      {{
        bootstrap_generate_env_vars_prompt_create_dirs.user_input
        | default('y')
      }}
  when: bootstrap_generate_env_vars_preflight is not defined

- name: Set create dirs answer preflight
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_create_dirs: true
  when: bootstrap_generate_env_vars_preflight is defined

- name: Ensure generated repo directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ bootstrap_generate_env_vars_env_dir }}"
    - "{{ playbook_dir }}/playbooks"
    - "{{ playbook_dir }}/configs"
    - "{{ playbook_dir }}/configs/controller"
    - "{{ playbook_dir }}/configs/job_templates"
    - "{{ playbook_dir }}/configs/workflows"
  when: bootstrap_generate_env_vars_create_dirs | bool

- name: Ask for base domain
  ansible.builtin.pause:
    prompt: "What is the base environment domain? (example: example.com)"
  register: bootstrap_generate_env_vars_prompt_base_domain
  when: bootstrap_generate_env_vars_preflight is not defined

- name: Set base domain interactive
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_base_domain: >-
      {{ bootstrap_generate_env_vars_prompt_base_domain.user_input }}
  when: bootstrap_generate_env_vars_preflight is not defined

- name: Ensure base domain was provided
  ansible.builtin.assert:
    that:
      - bootstrap_generate_env_vars_base_domain is defined
      - bootstrap_generate_env_vars_base_domain | length > 0
    fail_msg: "Base domain is required."

- name: Ask platform
  ansible.builtin.pause:
    prompt: "Platform [all/openshift/linux]"
  register: bootstrap_generate_env_vars_prompt_platform
  when: bootstrap_generate_env_vars_preflight is not defined

- name: Set platform answer interactive
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_platform: >-
      {{ bootstrap_generate_env_vars_prompt_platform.user_input }}
  when: bootstrap_generate_env_vars_preflight is not defined

- name: Ask OpenShift questions
  when:
    - bootstrap_generate_env_vars_preflight is not defined
    - bootstrap_generate_env_vars_platform in ['all', 'openshift']
  block:
    - name: Ask OpenShift API host
      ansible.builtin.pause:
        prompt: "OpenShift API host"
      register: bootstrap_generate_env_vars_prompt_ocp_host

    - name: Ask OpenShift domain
      ansible.builtin.pause:
        prompt: "OpenShift domain"
      register: bootstrap_generate_env_vars_prompt_ocp_domain

- name: Set all components when platform is all
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components:
      - openshift
      - keycloak
      - satellite
      - grafana
      - jira
      - patching
      - stig
  when:
    - bootstrap_generate_env_vars_preflight is not defined
    - bootstrap_generate_env_vars_platform == 'all'

- name: Ask for enabled components when platform is not all
  ansible.builtin.pause:
    prompt: >-
      What additional components do you want to enable?
      (comma separated)
      Options: openshift,keycloak,satellite,grafana,jira,patching,stig
  register: bootstrap_generate_env_vars_prompt_components
  when:
    - bootstrap_generate_env_vars_preflight is not defined
    - bootstrap_generate_env_vars_platform != 'all'

- name: Set enabled components when platform is openshift
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          ['openshift'] +
          (
            bootstrap_generate_env_vars_prompt_components.user_input
            | default('', true)
            | lower
            | replace(' ', '')
            | split(',')
            | reject('equalto', '')
            | list
          )
        )
        | unique
        | list
      }}
  when:
    - bootstrap_generate_env_vars_preflight is not defined
    - bootstrap_generate_env_vars_platform == 'openshift'

- name: Set enabled components when platform is linux
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          bootstrap_generate_env_vars_prompt_components.user_input
          | default('patching', true)
          | lower
          | replace(' ', '')
          | split(',')
          | reject('equalto', '')
          | list
        )
        | unique
        | list
      }}
  when:
    - bootstrap_generate_env_vars_preflight is not defined
    - bootstrap_generate_env_vars_platform == 'linux'

- name: Show selected components
  ansible.builtin.debug:
    var: bootstrap_generate_env_vars_components

- name: Expand AWS platform app selections into vars components
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          bootstrap_generate_env_vars_components
          + (
              (
                bootstrap_generate_env_vars_preflight.component_options.aws
                | default([])
                | map('lower')
                | list
              )
              if (
                bootstrap_generate_env_vars_preflight is defined
                and (
                  'aws' in (
                    bootstrap_generate_env_vars_preflight.components
                    | default(
                        bootstrap_generate_env_vars_preflight.platform
                        | default([])
                      )
                    | map('lower')
                    | list
                  )
                  or 'aws' in bootstrap_generate_env_vars_components
                )
                and (
                  bootstrap_generate_env_vars_preflight.component_options.aws
                  | default([])
                  | length
                ) > 0
              )
              else []
            )
        )
        | reject('equalto', 'aws')
        | unique
        | list
      }}
  when: bootstrap_generate_env_vars_preflight is defined

- name: Normalize patching selection to RHEL component vars
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          bootstrap_generate_env_vars_components
          + (
              ['rhel']
              if 'patching' in bootstrap_generate_env_vars_components
              else []
            )
        )
        | reject('equalto', 'patching')
        | unique
        | list
      }}

- name: Ensure shared AWS vault vars when AWS consumers are selected
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (
          bootstrap_generate_env_vars_components
          + (
              ['aws']
              if (
                bootstrap_generate_env_vars_components
                | intersect(['ec2_ami_copy', 'openshift', 'cert_manager'])
                | length > 0
              )
              else []
            )
        )
        | unique
        | list
      }}

- name: Show normalized selected components
  ansible.builtin.debug:
    var: bootstrap_generate_env_vars_components

- name: Skip Contoller API when installing AAP during bootstrap
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_use_aap: false
  when:
    - bootstrap_generate_env_vars_preflight is defined
    - >-
      (
        (
          bootstrap_generate_env_vars_preflight.pre_installs
          | default({})
        ).install_aap | default(false) | bool
      )
      or (
        (
          bootstrap_generate_env_vars_preflight.component_config.aap
          | default({})
        ).install_during_bootstrap | default(false) | bool
      )

# Expand satellite/idm/acs/aws options into keys for playbook/JT selection only.
# Keep bootstrap_generate_env_vars_components unchanged for vars_*.yml.
- name: >-
    Build playbook/JT app selectors from Satellite, IdM, ACS, and AWS options
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_playbook_components: >-
      {{
        (
          (
            bootstrap_generate_env_vars_components
            | reject('equalto', 'satellite')
            | reject('equalto', 'idm')
            | reject('equalto', 'aws')
            | list
          )
          +
          (
            (
              bootstrap_generate_env_vars_preflight.component_options.satellite
              | default([])
              | map('lower')
              | list
            )
            if (
              'satellite' in bootstrap_generate_env_vars_components
              and bootstrap_generate_env_vars_preflight is defined
              and (
                bootstrap_generate_env_vars_preflight.component_options.satellite
                | default([])
                | length
              ) > 0
            )
            else (
              []
            )
          )
          +
          (
            (
              bootstrap_generate_env_vars_preflight.component_options.idm
              | default([])
              | map('lower')
              | list
            )
            if (
              'idm' in bootstrap_generate_env_vars_components
              and bootstrap_generate_env_vars_preflight is defined
              and (
                bootstrap_generate_env_vars_preflight.component_options.idm
                | default([])
                | length
              ) > 0
            )
            else (
              []
            )
          )
          +
          (
            (
              bootstrap_generate_env_vars_preflight.component_options.acs
              | default([])
              | map('lower')
              | list
            )
            if (
              'acs' in bootstrap_generate_env_vars_components
              and bootstrap_generate_env_vars_preflight is defined
              and (
                bootstrap_generate_env_vars_preflight.component_options.acs
                | default([])
                | length
              ) > 0
            )
            else (
              []
            )
          )
          +
          (
            (
              bootstrap_generate_env_vars_preflight.component_options.aws
              | default([])
              | map('lower')
              | list
            )
            if (
              bootstrap_generate_env_vars_preflight is defined
              and 'aws' in (
                bootstrap_generate_env_vars_preflight.components
                | default(
                    bootstrap_generate_env_vars_preflight.platform
                    | default([])
                  )
                | map('lower')
                | list
              )
              and (
                bootstrap_generate_env_vars_preflight.component_options.aws
                | default([])
                | length
              ) > 0
            )
            else (
              []
            )
          )
        )
        | unique
        | list
      }}

- name: Show playbook/JT app selectors
  ansible.builtin.debug:
    var: bootstrap_generate_env_vars_playbook_components

- name: Include AAP component vars when Install AAP is requested
  ansible.builtin.set_fact:
    bootstrap_generate_env_vars_components: >-
      {{
        (bootstrap_generate_env_vars_components + ['aap'])
        | unique
        | list
      }}
  when:
    - bootstrap_generate_env_vars_preflight is defined
    - >-
      (
        (
          bootstrap_generate_env_vars_preflight.pre_installs
          | default({})
        ).install_aap | default(false) | bool
      )
      or (
        (
          bootstrap_generate_env_vars_preflight.component_config.aap
          | default({})
        ).install_during_bootstrap | default(false) | bool
      )

- name: Find existing generated component vars files
  ansible.builtin.find:
    paths:
      - "{{ bootstrap_generate_env_vars_env_dir }}"
    patterns:
      - "vars_*.yml"
    file_type: file
  register: bootstrap_generate_env_vars_existing_component_vars

- name: Find existing generated component vault files
  ansible.builtin.find:
    paths:
      - "{{ bootstrap_generate_env_vars_env_dir }}"
    patterns:
      - "vault_*.yml"
    file_type: file
  register: bootstrap_generate_env_vars_existing_component_vaults

- name: Remove stale generated component vars files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ bootstrap_generate_env_vars_existing_component_vars.files }}"
  when:
    - item.path | basename not in (
        bootstrap_generate_env_vars_components
        | map('regex_replace', '^(.*)$', 'vars_\\1.yml')
        | list
      )

- name: Remove stale generated component vault files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ bootstrap_generate_env_vars_existing_component_vaults.files }}"
  when:
    - item.path | basename not in (
        bootstrap_generate_env_vars_components
        | reject('equalto', 'ec2_ami_copy')
        | map('regex_replace', '^(.*)$', 'vault_\\1.yml')
        | list
      )

- name: Write shared OpenShift infra_config_vars.yml
  ansible.builtin.template:
    src: infra_config_vars.yml.j2
    dest: "{{ bootstrap_generate_env_vars_env_dir }}/infra_config_vars.yml"
    mode: "0600"
    force: "{{ bootstrap_generate_env_vars_force | bool }}"

- name: Write component vars files
  ansible.builtin.template:
    src: component_vars.yml.j2
    dest: >-
      {{
        bootstrap_generate_env_vars_env_dir
      }}/vars_{{ component_name }}.yml
    mode: "0644"
    force: "{{ bootstrap_generate_env_vars_force | bool }}"
  loop: "{{ bootstrap_generate_env_vars_components }}"
  loop_control:
    loop_var: component_name

- name: Write component vault files
  ansible.builtin.template:
    src: component_vault.yml.j2
    dest: >-
      {{
        bootstrap_generate_env_vars_env_dir
      }}/vault_{{ component_name }}.yml
    mode: "0600"
    force: "{{ bootstrap_generate_env_vars_force | bool }}"
  loop: "{{ bootstrap_generate_env_vars_components }}"
  loop_control:
    loop_var: component_name
  when: component_name != 'ec2_ami_copy'

- name: Remove legacy per-component ec2_ami_copy vault file after template pass
  ansible.builtin.file:
    path: >-
      {{ bootstrap_generate_env_vars_env_dir }}/vault_ec2_ami_copy.yml
    state: absent
  when: "'ec2_ami_copy' in bootstrap_generate_env_vars_components"

# yamllint disable rule:line-length
- name: Overlay preflight component values into generated vars/vault files  # noqa: jinja[spacing]
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PYCODE'
    from pathlib import Path
    import base64
    import binascii
    import copy
    import json
    import re
    import shutil
    import yaml

    class NoAliasDumper(yaml.SafeDumper):
        def ignore_aliases(self, data):
            return True

    class QuotedString(str):
        pass

    def quoted_string_representer(dumper, data):
        return dumper.represent_scalar("tag:yaml.org,2002:str", data, style='"')

    NoAliasDumper.add_representer(QuotedString, quoted_string_representer)

    preflight_file = Path("{{ preflight_json }}")
    env_dir = Path("{{ bootstrap_generate_env_vars_env_dir }}")
    selected_components = set({{ bootstrap_generate_env_vars_components | to_json }})

    preflight = json.loads(preflight_file.read_text())

    def is_secret_key(key):
        k = str(key or "").lower()
        if k in {"hub_s3_secret", "hub_azure_secret"}:
            return False
        return any(
            x in k
            for x in [
                "password",
                "token",
                "secret",
                "vault",
                "credential",
                "tls_key",
                "tls_crt",
                "activation_key",
                "manifest_content",
            ]
        )

    def load_yaml(path):
        if not path.exists():
            return {}
        data = yaml.safe_load(path.read_text()) or {}
        return data if isinstance(data, dict) else {}

    def write_yaml(path, data, mode="0644"):
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text("---\n" + yaml.dump(data, Dumper=NoAliasDumper, sort_keys=False, width=1000))
        path.chmod(int(mode, 8))

    def first_present(*values):
        for value in values:
            if value is not None and value != "":
                return value
        return None

    def merge_shared_aws_vault(values):
        aws_path = env_dir / "vault_aws.yml"
        aws_data = load_yaml(aws_path)
        changed = False
        combined = {
            str(key): value
            for key, value in (values or {}).items()
            if value is not None
        }
        access_key = first_present(
            combined.get("access_key_id"),
            combined.get("awspca_access_key_id"),
        )
        secret_key = first_present(
            combined.get("secret_access_key"),
            combined.get("awspca_secret_access_key"),
        )
        session_token = combined.get("session_token")
        if access_key is not None:
            aws_data["vault_aws_access_key_id"] = str(access_key)
            changed = True
        if secret_key is not None:
            aws_data["vault_aws_secret_access_key"] = str(secret_key)
            changed = True
        if session_token is not None:
            aws_data["vault_aws_session_token"] = str(session_token)
            changed = True
        if changed:
            write_yaml(aws_path, aws_data, "0600")

    def as_bool(value, default=True):
        if value is None:
            return default
        if isinstance(value, bool):
            return value
        return str(value).strip().lower() in {"1", "true", "yes", "y", "on"}

    install_aap = as_bool(
        (preflight.get("pre_installs") or {}).get("install_aap"),
        False,
    )
    attach_aap_license = as_bool(
        (preflight.get("pre_installs") or {}).get("attach_aap_license"),
        False,
    ) or as_bool(
        ((preflight.get("pre_installs") or {}).get("aap") or {}).get("license_only"),
        False,
    ) or as_bool(
        ((preflight.get("component_config") or {}).get("aap") or {}).get("license_only"),
        False,
    )
    # install_during_bootstrap alone must not mean full operator install when
    # attach/license_only is set (UI sets both for license-only attach).
    if (
        not install_aap
        and not attach_aap_license
        and as_bool(
            ((preflight.get("component_config") or {}).get("aap") or {}).get(
                "install_during_bootstrap"
            ),
            False,
        )
    ):
        install_aap = True
    if install_aap or attach_aap_license:
        selected_components.add("aap")
        # License-only / attach must still have a component_config.aap block so
        # merge_component runs (hostname, RHN, license_mode).
        preflight.setdefault("component_config", {})
        aap_cfg = preflight["component_config"].setdefault("aap", {})
        pre_aap = ((preflight.get("pre_installs") or {}).get("aap") or {})
        preflight_aap = preflight.get("aap") or {}
        if install_aap:
            aap_cfg["install_during_bootstrap"] = True
        if attach_aap_license and not install_aap:
            aap_cfg["install_during_bootstrap"] = True
            aap_cfg["license_only"] = True
        for key in (
            "license_mode",
            "subscription_manifest_file",
            "subscription_manifest_content_base64",
            "subscription_manifest_encoding",
            "rhn_username",
            "rhn_password",
            "rhn_subscription_id",
            "rhn_client_id",
            "rhn_client_secret",
            "admin_password",
            "hostname",
            "namespace",
        ):
            if not aap_cfg.get(key) and pre_aap.get(key):
                aap_cfg[key] = pre_aap.get(key)
        # Attach/license-only: General tab aap.hostname / admin_password win over
        # stale Install AAP component_config host fields.
        if attach_aap_license and not install_aap:
            if preflight_aap.get("hostname"):
                aap_cfg["hostname"] = preflight_aap.get("hostname")
            if preflight_aap.get("admin_password"):
                aap_cfg["admin_password"] = preflight_aap.get("admin_password")
        else:
            if not aap_cfg.get("hostname") and preflight_aap.get("hostname"):
                aap_cfg["hostname"] = preflight_aap.get("hostname")
            if not aap_cfg.get("admin_password") and preflight_aap.get("admin_password"):
                aap_cfg["admin_password"] = preflight_aap.get("admin_password")

    aap_version_dotted = {"24": "2.4", "25": "2.5", "26": "2.6", "27": "2.7"}
    aap_version_number = {"2.4": "24", "2.5": "25", "2.6": "26", "2.7": "27"}

    def aap_dotted_version(*values, default="2.7"):
        for value in values:
            if value is None or value == "":
                continue
            text = str(value).strip()
            if text in aap_version_dotted:
                return aap_version_dotted[text]
            if text in aap_version_number:
                return text
        return default

    jinja_open = "{" + "{"
    jinja_close = "}" + "}"

    def vault_ref(name):
        return QuotedString(jinja_open + " " + name + " " + jinja_close)

    def playbook_file_ref(filename):
        return (
            jinja_open
            + " playbook_dir "
            + jinja_close
            + "/../../files/"
            + filename
        )

    def safe_upload_filename(name, default_name):
        candidate = Path(str(name or default_name)).name
        candidate = re.sub(r"[^A-Za-z0-9._-]+", "-", candidate).strip(".-")
        return candidate or default_name

    def write_repo_file_from_preflight(filename, content, default_name, encoding="base64"):
        project_dir = env_dir.parents[2] if len(env_dir.parents) >= 3 else env_dir
        files_dir = project_dir / "files"
        files_dir.mkdir(parents=True, exist_ok=True)
        target = files_dir / safe_upload_filename(filename, default_name)
        if str(encoding or "base64").lower() in ("base64", "b64"):
            try:
                raw = base64.b64decode(str(content), validate=True)
            except (binascii.Error, ValueError) as exc:
                raise SystemExit(f"Invalid base64 upload content for {target.name}: {exc}") from exc
            target.write_bytes(raw)
        else:
            target.write_text(str(content), encoding="utf-8")
        target.chmod(0o600)
        return target

    def copy_repo_file_from_path(src, filename, default_name):
        project_dir = env_dir.parents[2] if len(env_dir.parents) >= 3 else env_dir
        files_dir = project_dir / "files"
        files_dir.mkdir(parents=True, exist_ok=True)
        target = files_dir / safe_upload_filename(filename, default_name)
        shutil.copy2(str(src), target)
        target.chmod(0o600)
        return target

    def merge_component(component, cfg):
        if not isinstance(cfg, dict):
            return

        vars_path = env_dir / f"vars_{component}.yml"
        vault_path = env_dir / f"vault_{component}.yml"

        vars_data = load_yaml(vars_path)
        vault_data = load_yaml(vault_path)
        vars_data_changed = False
        vault_data_changed = False

        public_values = {k: v for k, v in cfg.items() if not is_secret_key(k)}
        secret_values = {k: v for k, v in cfg.items() if is_secret_key(k)}
        passthrough_public_values = copy.deepcopy(public_values)

        quoted_public_keys = {
            "activation_key",
            "admin_activation_key",
            "admin_rhn_activation_key",
            "rhn_activation_key",
            "rhn_org_id",
            "org_id",
            "redhat_org_id",
            "satellite_install_rhn_activation_key",
            "satellite_install_rhn_org_id",
            "satellite_admin_rhn_activation_key",
            "satellite_rhn_org_id",
        }
        for quoted_key in quoted_public_keys:
            if quoted_key in public_values and public_values[quoted_key] is not None:
                public_values[quoted_key] = QuotedString(str(public_values[quoted_key]))

        if component == "satellite":
            satellite_role_only_keys = {
                "activation_key",
                "admin_activation_key",
                "admin_rhn_activation_key",
                "rhn_activation_key",
