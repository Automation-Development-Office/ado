---
- name: Find a running dirsrv pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp_search_dirsrv_target_namespace }}"
    label_selectors:
      - "{{ ocp_search_dirsrv_app_label }}"
  register: ocp_search_dirsrv_pods

- name: Fail if no dirsrv pods found
  ansible.builtin.fail:
    msg: "No pods with label {{ ocp_search_dirsrv_app_label }} in namespace {{ ocp_search_dirsrv_target_namespace }}"
  when:
    - ocp_search_dirsrv_fail_if_no_pod | bool
    - (ocp_search_dirsrv_pods.resources | length) == 0

- name: Pick first pod name
  ansible.builtin.set_fact:
    ocp_search_dirsrv_pod: "{{ (ocp_search_dirsrv_pods.resources | map(attribute='metadata.name') | list | first) | default('') }}"

- name: Render search script
  ansible.builtin.set_fact:
    ocp_search_dirsrv_script: "{{ lookup('template', 'run_search.sh.j2') }}"
  when: ocp_search_dirsrv_pod | length > 0

- name: Run ldapsearch queries inside container
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp_search_dirsrv_target_namespace }}"
    pod: "{{ ocp_search_dirsrv_pod }}"
    container: "{{ ocp_search_dirsrv_container_name }}"
    command: |
      sh -lc {{ ocp_search_dirsrv_script | to_json }}
  register: ocp_search_dirsrv_out
  failed_when: false
  when: ocp_search_dirsrv_pod | length > 0

- name: Print output
  ansible.builtin.debug:
    msg: "{{ ocp_search_dirsrv_out.stdout | default('No output') }}"
  when:
    - ocp_search_dirsrv_print_only | bool
    - ocp_search_dirsrv_pod | length > 0
