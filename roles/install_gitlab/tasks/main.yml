# yamllint disable rule:line-length
---
# Install standalone GitLab CE/EE on RHEL (Omnibus).

- name: Resolve GitLab package name from edition
  ansible.builtin.set_fact:
    install_gitlab_package_effective: >-
      {{
        install_gitlab_package
        if (install_gitlab_package | default('') | length > 0)
        else (
          'gitlab-ee'
          if (install_gitlab_edition | lower) in ['ee', 'enterprise']
          else 'gitlab-ce'
        )
      }}

- name: Resolve GitLab repo bootstrap script URL
  ansible.builtin.set_fact:
    install_gitlab_repo_script_url_effective: >-
      {{
        install_gitlab_repo_script_url
        if (install_gitlab_repo_script_url | default('') | length > 0)
        else (
          'https://packages.gitlab.com/install/repositories/gitlab/gitlab-ee/script.rpm.sh'
          if (install_gitlab_edition | lower) in ['ee', 'enterprise']
          else 'https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.rpm.sh'
        )
      }}

- name: Resolve GitLab external_url (https when TLS PEMs present)
  ansible.builtin.set_fact:
    install_gitlab_external_url_effective: >-
      {{
        install_gitlab_external_url
        if (install_gitlab_external_url | default('') | length > 0)
        else (
          'https://' ~ install_gitlab_hostname
          if (
            (install_gitlab_tls_crt | default('') | length > 0)
            and (install_gitlab_tls_key | default('') | length > 0)
          )
          else 'http://' ~ install_gitlab_hostname
        )
      }}

- name: Guard — GitLab hostname and root password required
  ansible.builtin.assert:
    that:
      - install_gitlab_hostname | length > 0
      - install_gitlab_root_password | length > 0
      - install_gitlab_external_url_effective | length > 0
    fail_msg: >-
      install_gitlab needs hostname, root password, and a resolvable
      external_url (set install_gitlab_external_url or hostname + optional TLS).

- name: Ensure GitLab Omnibus dependencies
  ansible.builtin.dnf:
    name:
      - curl
      - openssh-server
      - postfix
      - tar
      - tzdata
      - perl
      - policycoreutils-python-utils
      - firewalld
    state: present
  when: not (install_gitlab_skip_packages | default(false) | bool)
  register: install_gitlab_deps
  failed_when: false

- name: Fail when deps missing and skip_packages is false
  ansible.builtin.fail:
    msg: >-
      Could not install GitLab dependencies via dnf (host may be unregistered).
      Pre-install deps and set install_gitlab_skip_packages=true, or provide
      install_gitlab_rpm_path / install_gitlab_rpm_url for airgap.
  when:
    - not (install_gitlab_skip_packages | default(false) | bool)
    - (install_gitlab_deps.rc | default(0)) != 0
      or (install_gitlab_deps.failed | default(false))

- name: Ensure staging directory for GitLab RPM
  ansible.builtin.file:
    path: /var/lib/gitlab-stage
    state: directory
    mode: "0750"
  when: >-
    (install_gitlab_rpm_path | default('') | length > 0)
    or (install_gitlab_rpm_url | default('') | length > 0)

- name: Copy GitLab RPM from Contoller (airgap)
  ansible.builtin.copy:
    src: "{{ install_gitlab_rpm_path }}"
    dest: /var/lib/gitlab-stage/gitlab.rpm
    mode: "0644"
  when: install_gitlab_rpm_path | default('') | length > 0

- name: Download GitLab RPM (airgap / offline URL)
  ansible.builtin.get_url:
    url: "{{ install_gitlab_rpm_url }}"
    dest: /var/lib/gitlab-stage/gitlab.rpm
    mode: "0644"
  when:
    - install_gitlab_rpm_path | default('') | length == 0
    - install_gitlab_rpm_url | default('') | length > 0

- name: Install GitLab from local RPM
  ansible.builtin.dnf:
    name: /var/lib/gitlab-stage/gitlab.rpm
    state: present
    disable_gpg_check: true
  environment:
    EXTERNAL_URL: "{{ install_gitlab_external_url_effective }}"
  when: >-
    (install_gitlab_rpm_path | default('') | length > 0)
    or (install_gitlab_rpm_url | default('') | length > 0)

- name: Add GitLab package repository (packages.gitlab.com)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "{{ install_gitlab_repo_script_url_effective }}" | bash
  args:
    creates: "/etc/yum.repos.d/gitlab_{{ install_gitlab_package_effective }}.repo"
  when:
    - install_gitlab_rpm_path | default('') | length == 0
    - install_gitlab_rpm_url | default('') | length == 0
    - not (install_gitlab_skip_packages | default(false) | bool)
  changed_when: true

- name: Install GitLab package from packages.gitlab.com
  ansible.builtin.dnf:
    name: "{{ install_gitlab_package_effective }}"
    state: present
  environment:
    EXTERNAL_URL: "{{ install_gitlab_external_url_effective }}"
  when:
    - install_gitlab_rpm_path | default('') | length == 0
    - install_gitlab_rpm_url | default('') | length == 0

- name: Ensure GitLab TLS directory exists
  ansible.builtin.file:
    path: "{{ install_gitlab_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: >-
    (install_gitlab_tls_crt | default('') | length > 0)
    and (install_gitlab_tls_key | default('') | length > 0)

- name: Install GitLab TLS certificate PEM
  ansible.builtin.copy:
    dest: "{{ install_gitlab_tls_dir }}/{{ install_gitlab_hostname }}.crt"
    content: "{{ install_gitlab_tls_crt }}"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  when: >-
    (install_gitlab_tls_crt | default('') | length > 0)
    and (install_gitlab_tls_key | default('') | length > 0)
  notify: Reconfigure GitLab

- name: Install GitLab TLS private key PEM
  ansible.builtin.copy:
    dest: "{{ install_gitlab_tls_dir }}/{{ install_gitlab_hostname }}.key"
    content: "{{ install_gitlab_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: >-
    (install_gitlab_tls_crt | default('') | length > 0)
    and (install_gitlab_tls_key | default('') | length > 0)
  notify: Reconfigure GitLab

- name: Write gitlab.rb (external_url + initial root password)
  ansible.builtin.copy:
    dest: "{{ install_gitlab_config_path }}"
    mode: "0600"
    owner: root
    group: root
    content: |
      # Managed by infra.ado.install_gitlab — do not edit by hand.
      external_url '{{ install_gitlab_external_url_effective }}'
      gitlab_rails['initial_root_password'] = '{{ install_gitlab_root_password }}'
      {% if (install_gitlab_tls_crt | default('') | length > 0)
            and (install_gitlab_tls_key | default('') | length > 0) %}
      nginx['ssl_certificate'] = "{{ install_gitlab_tls_dir }}/{{ install_gitlab_hostname }}.crt"
      nginx['ssl_certificate_key'] = "{{ install_gitlab_tls_dir }}/{{ install_gitlab_hostname }}.key"
      {% endif %}
      nginx['listen_port'] = {{ install_gitlab_http_port }}
      {% if (install_gitlab_tls_crt | default('') | length > 0)
            and (install_gitlab_tls_key | default('') | length > 0) %}
      nginx['ssl_port'] = {{ install_gitlab_https_port }}
      {% endif %}
  no_log: true
  notify: Reconfigure GitLab

- name: Apply GitLab configuration (gitlab-ctl reconfigure)
  ansible.builtin.meta: flush_handlers

- name: Ensure gitlab-ctl reconfigure has run at least once
  ansible.builtin.command: gitlab-ctl reconfigure
  args:
    creates: /var/opt/gitlab/bootstrapped
  register: install_gitlab_reconfigure
  changed_when: install_gitlab_reconfigure.rc == 0

- name: Mark GitLab bootstrap complete
  ansible.builtin.file:
    path: /var/opt/gitlab/bootstrapped
    state: touch
    mode: "0644"
  when: install_gitlab_reconfigure is changed

- name: Open firewall ports for GitLab
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ install_gitlab_http_port }}/tcp"
    - "{{ install_gitlab_https_port }}/tcp"
  failed_when: false

- name: Enable and start GitLab runit service
  ansible.builtin.systemd:
    name: gitlab-runsvdir
    enabled: true
    state: started
    daemon_reload: true

- name: Show GitLab standalone URL
  ansible.builtin.debug:
    msg: >-
      GitLab ({{ install_gitlab_package_effective }}) is available at
      {{ install_gitlab_external_url_effective }}/
      (initial root password set via gitlab.rb / GITLAB_ROOT_PASSWORD pattern).
