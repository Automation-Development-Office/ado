---
- name: Normalize descheduler profiles (API rejects SoftTopology + Topology together)
  ansible.builtin.set_fact:
    ocp_descheduler_profiles: >-
      {{
        (
          ocp_descheduler_profiles
          | default([])
          | unique
          | reject('equalto', 'SoftTopologyAndDuplicates')
          | list
        )
        if ('TopologyAndDuplicates' in (ocp_descheduler_profiles | default([])))
        else (
          ocp_descheduler_profiles
          | default([])
          | unique
          | list
        )
      }}

- name: Create Kube Descheduler instance
  kubernetes.core.k8s:
    state: present
    template: kube_cluster.j2
  when: state | default('present') == 'present'

- name: Delete Kube Descheduler instance
  kubernetes.core.k8s:
    state: absent
    api_version: operator.openshift.io/v1
    kind: KubeDescheduler
    name: "{{ instance_name }}"
    namespace: "{{ name_space }}"
  when: state | default('present') == 'absent'
