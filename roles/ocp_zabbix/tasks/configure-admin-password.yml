---
# Set Zabbix Admin password after web UI is reachable.

- name: Configure Zabbix Admin password
  when: (zabbix_admin_password | default('') | string | length) > 0
  block:
    - name: Wait for Zabbix web HTTP endpoint
      ansible.builtin.uri:
        url: "https://{{ ocp_zabbix_hostname }}/"
        validate_certs: false
        status_code: [200, 302, 401, 403]
      register: ocp_zabbix_web_probe
      until: ocp_zabbix_web_probe.status in [200, 302, 401, 403]
      retries: 30
      delay: 10
      changed_when: false

    - name: Change default Zabbix Admin password via API
      ansible.builtin.uri:
        url: "https://{{ ocp_zabbix_hostname }}/api_jsonrpc.php"
        method: POST
        validate_certs: false
        headers:
          Content-Type: application/json-rpc
        body_format: json
        body:
          jsonrpc: "2.0"
          method: user.login
          params:
            username: "{{ zabbix_admin_user | default('Admin') }}"
            password: "{{ zabbix_default_admin_password | default('zabbix') }}"
          id: 1
        status_code: [200]
      register: ocp_zabbix_login_default
      no_log: true
      failed_when: false

    - name: Login with target Zabbix Admin password when default login fails
      ansible.builtin.uri:
        url: "https://{{ ocp_zabbix_hostname }}/api_jsonrpc.php"
        method: POST
        validate_certs: false
        headers:
          Content-Type: application/json-rpc
        body_format: json
        body:
          jsonrpc: "2.0"
          method: user.login
          params:
            username: "{{ zabbix_admin_user | default('Admin') }}"
            password: "{{ zabbix_admin_password }}"
          id: 1
        status_code: [200]
      register: ocp_zabbix_login_target
      when:
        - ocp_zabbix_login_default.json.result is not defined
          or (ocp_zabbix_login_default.json.result | string | length) == 0
      no_log: true
      failed_when: false

    - name: Select working Zabbix login token
      ansible.builtin.set_fact:
        ocp_zabbix_login_token: >-
          {{
            ocp_zabbix_login_default.json.result
            if (ocp_zabbix_login_default.json.result is defined
                and (ocp_zabbix_login_default.json.result | string | length) > 0)
            else ocp_zabbix_login_target.json.result | default('')
          }}
      no_log: true

    - name: Apply new Zabbix Admin password when default login still works
      ansible.builtin.uri:
        url: "https://{{ ocp_zabbix_hostname }}/api_jsonrpc.php"
        method: POST
        validate_certs: false
        headers:
          Content-Type: application/json-rpc
        body_format: json
        body:
          jsonrpc: "2.0"
          method: user.update
          params:
            userid: "1"
            passwd: "{{ zabbix_admin_password }}"
          auth: "{{ ocp_zabbix_login_token }}"
          id: 2
        status_code: [200]
      when:
        - ocp_zabbix_login_token is defined
        - (ocp_zabbix_login_token | string | length) > 0
        - ocp_zabbix_login_default.json.result is defined
        - (ocp_zabbix_login_default.json.result | string | length) > 0
        - zabbix_admin_password != (zabbix_default_admin_password | default('zabbix'))
      no_log: true
      failed_when: false

    - name: Confirm Zabbix Admin password is already set
      ansible.builtin.debug:
        msg: Zabbix Admin password already matches preflight target; no reset needed.
      when:
        - ocp_zabbix_login_target.json.result is defined
        - (ocp_zabbix_login_target.json.result | string | length) > 0
        - ocp_zabbix_login_default.json.result is not defined
          or (ocp_zabbix_login_default.json.result | string | length) == 0
