---
- name: Resolve DevSpaces app namespace for delete  # noqa: jinja[invalid]
  ansible.builtin.set_fact:
    ocp_devspaces_app_ns: "{{ app_namespace | default(devspaces_namespace | default(namespace | default('openshift-devspaces'))) }}"

- name: Delete CheCluster instance
  kubernetes.core.k8s:
    state: absent
    api_version: org.eclipse.che/v2
    kind: CheCluster
    name: devspaces
    namespace: "{{ ocp_devspaces_app_ns }}"

- name: Delete getting-started samples ConfigMap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: getting-started-samples
    namespace: "{{ ocp_devspaces_app_ns }}"
