---
- name: Gather BookStack validation objects
  kubernetes.core.k8s_info:
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ bookstack_namespace }}"
    validate_certs: "{{ bookstack_validate_certs }}"
  loop:
    - {api: apps/v1, kind: Deployment, name: bookstack}
    - {api: apps/v1, kind: Deployment, name: bookstack-mariadb}
    - {api: v1, kind: Service, name: "{{ bookstack_service_name }}"}
    - {api: v1, kind: Service, name: "{{ bookstack_db_service_name }}"}
    - {api: v1, kind: PersistentVolumeClaim, name: bookstack-data}
    - {api: v1, kind: PersistentVolumeClaim, name: bookstack-mariadb}
    - {api: route.openshift.io/v1, kind: Route, name: bookstack}
  register: bookstack_openshift_validation

- name: Assert BookStack core objects exist
  ansible.builtin.assert:
    that:
      - item.resources | length > 0
    fail_msg: "Missing {{ item.item.kind }}/{{ item.item.name }} in {{ bookstack_namespace }}"
  loop: "{{ bookstack_openshift_validation.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.name }}"

- name: Assert Deployments are Available
  ansible.builtin.assert:
    that:
      - >
        (
          item.resources[0].status.conditions
          | selectattr('type', 'equalto', 'Available')
          | map(attribute='status')
          | first
          | default('False')
        ) == 'True'
    fail_msg: "Deployment {{ item.item.name }} is not Available"
  loop: "{{ bookstack_openshift_validation.results }}"
  when: item.item.kind == 'Deployment'
  loop_control:
    label: "{{ item.item.name }}"

- name: Assert PVCs are Bound
  ansible.builtin.assert:
    that:
      - item.resources[0].status.phase == 'Bound'
    fail_msg: "PVC {{ item.item.name }} is not Bound ({{ item.resources[0].status.phase | default('unknown') }})"
  loop: "{{ bookstack_openshift_validation.results }}"
  when: item.item.kind == 'PersistentVolumeClaim'
  loop_control:
    label: "{{ item.item.name }}"

- name: Show BookStack URL
  ansible.builtin.debug:
    msg: |
      BookStack available at:
      {{ bookstack_openshift_app_url_effective }}

      Default local login:
      {{ bookstack_admin_email }} / (set via bookstack_admin_password)
      OIDC: {{ bookstack_oidc_enabled | bool }} issuer={{ bookstack_oidc_issuer_resolved | default(bookstack_oidc_issuer | default('', true)) }}
