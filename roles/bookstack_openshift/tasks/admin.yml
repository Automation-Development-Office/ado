---
# Reset seeded admin password after BookStack is Available.
# k8s_exec has no environment=; pass values via a short inline PHP script.

- name: Find running BookStack application pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ bookstack_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=bookstack
      - app.kubernetes.io/component=app
    field_selectors:
      - status.phase=Running
    validate_certs: "{{ bookstack_validate_certs }}"
  register: bookstack_admin_pods
  when: bookstack_admin_password | default('') | length > 0

- name: Set BookStack admin pod name
  ansible.builtin.set_fact:
    bookstack_app_pod_name: "{{ bookstack_admin_pods.resources[0].metadata.name }}"
  when:
    - bookstack_admin_password | default('') | length > 0
    - bookstack_admin_pods.resources | default([]) | length > 0

- name: Reset BookStack local admin password
  kubernetes.core.k8s_exec:
    namespace: "{{ bookstack_namespace }}"
    pod: "{{ bookstack_app_pod_name }}"
    container: bookstack
    command: >-
      php -r
      '$email=base64_decode("{{ bookstack_admin_email | b64encode }}");
      $pass=base64_decode("{{ bookstack_admin_password | b64encode }}");
      require "/var/www/bookstack/vendor/autoload.php";
      $app=require "/var/www/bookstack/bootstrap/app.php";
      $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
      $kernel->bootstrap();
      $u=BookStack\Users\Models\User::query()->where("email",$email)->first();
      if(!$u){fwrite(STDERR,"user missing\n"); exit(2);}
      $u->password=Illuminate\Support\Facades\Hash::make($pass);
      $u->save();
      echo "ok\n";'
    validate_certs: "{{ bookstack_validate_certs }}"
  no_log: true
  register: bookstack_admin_password_result
  when:
    - bookstack_admin_password | default('') | length > 0
    - bookstack_app_pod_name | default('') | length > 0

- name: Show admin password update status
  ansible.builtin.debug:
    msg: >-
      BookStack local admin {{ bookstack_admin_email }} password updated
      (OIDC enabled={{ bookstack_oidc_enabled | bool }}).
  when:
    - bookstack_admin_password | default('') | length > 0
    - bookstack_admin_password_result is defined
    - (bookstack_admin_password_result.rc | default(1)) == 0
