---
# SPDX-License-Identifier: GPL-3.0-or-later
- name: ADO | Assert SMTP settings for requester notify
  ansible.builtin.assert:
    that:
      - vpn_access_smtp_host | length > 0
      - vpn_access_smtp_from | length > 0
      - vpn_access_email | length > 0
    fail_msg: SMTP host/from and requester email are required to send notifications.

- name: ADO | Render notification body
  ansible.builtin.set_fact:
    vpn_access_mail_body: >-
      {{
        lookup(
          'ansible.builtin.template',
          (vpn_access_mail_kind == 'approve')
          | ternary('email_approve.txt.j2', 'email_deny.txt.j2')
        )
      }}

- name: ADO | Send notification email to requester
  community.general.mail:
    host: "{{ vpn_access_smtp_host }}"
    port: "{{ vpn_access_smtp_port | int }}"
    username: "{{ vpn_access_smtp_user | default(omit, true) }}"
    password: "{{ vpn_access_smtp_password | default(omit, true) }}"
    from: "{{ vpn_access_smtp_from }}"
    to: "{{ vpn_access_email }}"
    subject: >-
      {{
        (vpn_access_mail_kind == 'approve')
        | ternary(
            '[ADO Lab] VPN / IdM access approved',
            '[ADO Lab] VPN / lab access denied'
          )
      }}
    body: "{{ vpn_access_mail_body }}"
    subtype: plain
    secure: "{{ vpn_access_smtp_secure }}"
  no_log: true
