---
# SPDX-License-Identifier: GPL-3.0-or-later
- name: ADO | Validate VPN access request inputs
  ansible.builtin.assert:
    that:
      - vpn_access_action in ['approve', 'deny']
      - vpn_access_email | length > 0
      - vpn_access_username | length > 0
    fail_msg: >-
      vpn_access requires action (approve|deny), username, and email
      (from portal / AAP extra_vars).

- name: ADO | Normalize VPN access username
  ansible.builtin.set_fact:
    vpn_access_username_safe: >-
      {{
        vpn_access_username
        | lower
        | regex_replace('[^a-z0-9._-]', '')
        | truncate(32, true, '', 0)
      }}

- name: ADO | Split display name for IdM given/sn
  ansible.builtin.set_fact:
    vpn_access_givenname: "{{ (vpn_access_display_name.split(' ') | first) | default(vpn_access_username_safe) }}"
    vpn_access_sn: >-
      {{
        (vpn_access_display_name.split(' ')[1:] | join(' '))
        if (vpn_access_display_name.split(' ') | length) > 1
        else vpn_access_username_safe
      }}

- name: ADO | Approve VPN / lab access
  ansible.builtin.include_tasks: approve.yml
  when: vpn_access_action == 'approve'

- name: ADO | Deny VPN / lab access
  ansible.builtin.include_tasks: deny.yml
  when: vpn_access_action == 'deny'
