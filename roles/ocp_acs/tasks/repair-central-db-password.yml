---
# Reset central-db when Postgres password in Secret no longer matches PVC data.
# Typical after a partial reinstall or operator secret regeneration on an existing DB.

- name: Repair ACS Central DB password mismatch when detected
  when:
    - not (ocp_acs_reinstall | default(false) | bool)
    - ocp_acs_repair_db_password_mismatch | default(true) | bool
  block:
    - name: Query Central deployment health
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ ocp_acs_namespace }}"
        name: "{{ ocp_acs_central_name }}"
      register: ocp_acs_repair_central_deploy
      failed_when: false

    - name: Query Central pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ocp_acs_namespace }}"
        label_selectors:
          - app=central
      register: ocp_acs_repair_central_pods
      failed_when: false

    - name: Read Central container logs for DB auth errors
      ansible.builtin.uri:
        url: >-
          {{
            (lookup('env', 'K8S_AUTH_HOST') | default(host | default(api_host | default('')), true))
            ~ '/api/v1/namespaces/'
            ~ ocp_acs_namespace
            ~ '/pods/'
            ~ ocp_acs_repair_central_pods.resources[0].metadata.name
            ~ '/log?container=central&tailLines=100'
          }}
        headers:
          Authorization: "Bearer {{ lookup('env', 'K8S_AUTH_API_KEY') | default(token | default(''), true) }}"
        validate_certs: "{{ lookup('env', 'K8S_AUTH_VERIFY_SSL') | default('no', true) == 'yes' }}"
        return_content: true
        status_code: [200, 404]
      register: ocp_acs_repair_central_logs
      changed_when: false
      failed_when: false
      when: ocp_acs_repair_central_pods.resources | default([]) | length > 0

    - name: Decide whether ACS Central DB password repair is required
      ansible.builtin.set_fact:
        ocp_acs_repair_db_password_needed: >-
          {{
            (
              ocp_acs_repair_central_deploy.resources | default([]) | length > 0
              and (
                (ocp_acs_repair_central_deploy.resources[0].status.availableReplicas | default(0) | int) < 1
                or (ocp_acs_repair_central_deploy.resources[0].status.unavailableReplicas | default(0) | int) > 0
              )
            )
            and (
              'password authentication failed' in (ocp_acs_repair_central_logs.content | default(''))
              or (
                ocp_acs_repair_central_pods.resources | default([]) | length > 0
                and (
                  ocp_acs_repair_central_pods.resources[0].status.containerStatuses | default([])
                  | selectattr('state.waiting.reason', 'defined')
                  | selectattr('state.waiting.reason', 'equalto', 'CrashLoopBackOff')
                  | list | length > 0
                )
                and (
                  ocp_acs_repair_central_pods.resources[0].status.containerStatuses | default([])
                  | map(attribute='restartCount')
                  | map('int')
                  | sum
                ) >= 3
              )
            )
          }}
      changed_when: false

    - name: Delete Central CR before DB password repair
      kubernetes.core.k8s:
        state: absent
        api_version: platform.stackrox.io/v1alpha1
        kind: Central
        namespace: "{{ ocp_acs_namespace }}"
        name: "{{ ocp_acs_central_name }}"
        wait: true
        wait_timeout: 300
      when: ocp_acs_repair_db_password_needed | default(false) | bool

    - name: Delete central-db StatefulSet (password repair)
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: StatefulSet
        namespace: "{{ ocp_acs_namespace }}"
        name: central-db
      when: ocp_acs_repair_db_password_needed | default(false) | bool

    - name: Delete central-db Service (password repair)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Service
        namespace: "{{ ocp_acs_namespace }}"
        name: central-db
      when: ocp_acs_repair_db_password_needed | default(false) | bool

    - name: Delete central-db-password secret (password repair)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ ocp_acs_namespace }}"
        name: central-db-password
      no_log: true
      when: ocp_acs_repair_db_password_needed | default(false) | bool

    - name: Delete central-db PVC (password repair)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ ocp_acs_namespace }}"
        name: "{{ ocp_acs_central_db_pvc_name | default('central-db') }}"
      when: ocp_acs_repair_db_password_needed | default(false) | bool

    - name: Wait for central-db PVC to finish deleting (password repair)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ ocp_acs_namespace }}"
        name: "{{ ocp_acs_central_db_pvc_name | default('central-db') }}"
      register: ocp_acs_repair_pvc_wait
      until: ocp_acs_repair_pvc_wait.resources | default([]) | length == 0
      retries: "{{ ocp_acs_pvc_delete_retries | default(36) | int }}"
      delay: "{{ ocp_acs_pvc_delete_delay | default(5) | int }}"
      when: ocp_acs_repair_db_password_needed | default(false) | bool

    - name: Report ACS Central DB password repair
      ansible.builtin.debug:
        msg: >-
          Reset central-db (Secret/PVC/StatefulSet) because Central could not
          authenticate to Postgres. Central CR will be recreated on this run.
      when: ocp_acs_repair_db_password_needed | default(false) | bool
