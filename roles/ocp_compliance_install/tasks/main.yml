---
# Wait for Compliance Operator pods (subscription is applied by the playbook).
- name: Compliance Install | Normalize operator namespace
  ansible.builtin.set_fact:
    ocp_compliance_install_operator_namespace: >-
      {{
        name_space
        | default(operator_namespace)
        | default(ocp_compliance_install_operator_namespace)
        | default('openshift-compliance')
      }}
  changed_when: false

- name: Compliance Install | Wait for operator pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp_compliance_install_operator_namespace }}"
  register: ocp_compliance_install_pods
  until: >-
    (
      ocp_compliance_install_pods.resources
      | default([])
      | selectattr('status.phase', 'defined')
      | selectattr('status.phase', 'equalto', 'Running')
      | list
      | length
    ) > 0
  retries: "{{ ocp_compliance_install_pod_retries | default(60) | int }}"
  delay: "{{ ocp_compliance_install_pod_delay | default(10) | int }}"
  changed_when: false

- name: Compliance Install | Show running pods
  ansible.builtin.debug:
    msg: >-
      Compliance Operator pods running in
      {{ ocp_compliance_install_operator_namespace }}:
      {{
        ocp_compliance_install_pods.resources
        | default([])
        | selectattr('status.phase', 'equalto', 'Running')
        | map(attribute='metadata.name')
        | list
      }}
