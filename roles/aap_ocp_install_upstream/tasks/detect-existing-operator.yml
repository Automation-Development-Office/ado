---
# yamllint disable rule:line-length
# A cluster-scoped AAP OperatorGroup owns the AAP CRDs cluster-wide.
# A second OperatorGroup in another namespace causes
# InterOperatorGroupOwnerConflict and can break the existing install.
- name: detect-existing-operator | List operator subscriptions
  kubernetes.core.k8s_info:
    host: "{{ __aap_ocp_install_auth_results['openshift_auth']['host'] }}"
    api_key: "{{ __aap_ocp_install_auth_results['openshift_auth']['api_key'] }}"
    validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
    kind: Subscription
    api_version: operators.coreos.com/v1alpha1
  register: aap_ocp_install_existing_subs

- name: detect-existing-operator | Look up AAP subscription in common namespaces
  kubernetes.core.k8s_info:
    host: "{{ __aap_ocp_install_auth_results['openshift_auth']['host'] }}"
    api_key: "{{ __aap_ocp_install_auth_results['openshift_auth']['api_key'] }}"
    validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
    kind: Subscription
    api_version: operators.coreos.com/v1alpha1
    name: ansible-automation-platform-operator
    namespace: "{{ item }}"
  loop:
    - aap
    - ansible-automation-platform
    - openshift-operators
  register: aap_ocp_install_common_ns_subs
  failed_when: false

- name: detect-existing-operator | List operator groups
  kubernetes.core.k8s_info:
    host: "{{ __aap_ocp_install_auth_results['openshift_auth']['host'] }}"
    api_key: "{{ __aap_ocp_install_auth_results['openshift_auth']['api_key'] }}"
    validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
    kind: OperatorGroup
    api_version: operators.coreos.com/v1
  register: aap_ocp_install_existing_ogs

- name: detect-existing-operator | Classify existing AAP operator resources
  ansible.builtin.set_fact:
    aap_ocp_install_reuse_existing_operator: false
    aap_ocp_install_existing_aap_version: ''
    aap_ocp_install_existing_aap_subs: >-
      {{
        (
          (aap_ocp_install_existing_subs.resources | default([]))
          + (
              aap_ocp_install_common_ns_subs.results
              | default([])
              | map(attribute='resources')
              | list
              | flatten
            )
        )
        | selectattr('spec.name', 'defined')
        | selectattr('spec.name', 'equalto', 'ansible-automation-platform-operator')
        | list
      }}
    aap_ocp_install_existing_aap_ogs: >-
      {{
        aap_ocp_install_existing_ogs.resources
        | default([])
        | selectattr('metadata.name', 'defined')
        | selectattr('metadata.name', 'equalto', 'ansible-automation-platform-operator')
        | list
      }}
    aap_ocp_install_requested_aap_version: >-
      {{
        aap_ocp_install_operator.channel
        | default('')
        | regex_search('stable-([0-9]+\.[0-9]+)', '\1')
        | default('', true)
      }}

- name: detect-existing-operator | Split local vs foreign operator resources
  ansible.builtin.set_fact:
    aap_ocp_install_foreign_aap_subs: >-
      {{
        aap_ocp_install_existing_aap_subs
        | rejectattr('metadata.namespace', 'equalto', aap_ocp_install_namespace)
        | list
      }}
    aap_ocp_install_local_aap_subs: >-
      {{
        aap_ocp_install_existing_aap_subs
        | selectattr('metadata.namespace', 'equalto', aap_ocp_install_namespace)
        | list
      }}
    aap_ocp_install_foreign_aap_ogs: >-
      {{
        aap_ocp_install_existing_aap_ogs
        | rejectattr('metadata.namespace', 'equalto', aap_ocp_install_namespace)
        | list
      }}
    aap_ocp_install_local_aap_ogs: >-
      {{
        aap_ocp_install_existing_aap_ogs
        | selectattr('metadata.namespace', 'equalto', aap_ocp_install_namespace)
        | list
      }}

- name: detect-existing-operator | Detect a cluster-scoped AAP operator elsewhere
  ansible.builtin.set_fact:
    aap_ocp_install_foreign_cluster_scoped: >-
      {{
        (
          aap_ocp_install_foreign_aap_subs
          | map(attribute='spec.channel')
          | map('default', '', true)
          | map('string')
          | select('match', '.*-cluster-scoped$')
          | list
          | length > 0
        )
        or (
          aap_ocp_install_foreign_aap_ogs
          | selectattr('spec.targetNamespaces', 'undefined')
          | list
          | length > 0
        )
        or (
          aap_ocp_install_foreign_aap_ogs
          | selectattr('spec.targetNamespaces', 'defined')
          | selectattr('spec.targetNamespaces', 'equalto', [])
          | list
          | length > 0
        )
      }}
    aap_ocp_install_existing_operator_namespace: >-
      {{
        (
          aap_ocp_install_foreign_aap_subs
          | map(attribute='metadata.namespace')
          | list
          | first
          | default(
            aap_ocp_install_foreign_aap_ogs
            | map(attribute='metadata.namespace')
            | list
            | first
            | default('', true),
            true
          )
        )
      }}
    aap_ocp_install_existing_operator_channel: >-
      {{
        aap_ocp_install_foreign_aap_subs
        | map(attribute='spec.channel')
        | list
        | first
        | default('', true)
      }}

- name: detect-existing-operator | Resolve existing operator version
  ansible.builtin.set_fact:
    aap_ocp_install_existing_aap_version: >-
      {{
        aap_ocp_install_existing_operator_channel
        | default('')
        | regex_search('stable-([0-9]+\.[0-9]+)', '\1')
        | default('', true)
      }}
  when: aap_ocp_install_foreign_aap_subs | length > 0

- name: detect-existing-operator | Fail when this namespace already conflicts with a cluster-scoped operator
  ansible.builtin.fail:
    msg: >-
      Namespace {{ aap_ocp_install_namespace }} already has an AAP OperatorGroup
      or Subscription, and a cluster-scoped AAP operator already exists in
      {{ aap_ocp_install_existing_operator_namespace }}
      (channel {{ aap_ocp_install_existing_operator_channel | default('unknown') }}).
      Two OperatorGroups providing the same APIs cause
      InterOperatorGroupOwnerConflict and can break the existing AAP.
      Delete the AAP OperatorGroup and Subscription in
      {{ aap_ocp_install_namespace }} (do not remove the existing operator in
      {{ aap_ocp_install_existing_operator_namespace }}), then rerun.
      A different AAP version cannot be installed beside a cluster-scoped
      operator; a second instance must reuse
      {{ aap_ocp_install_existing_aap_version | default('the existing') }}.
  when:
    - aap_ocp_install_foreign_cluster_scoped | bool
    - (aap_ocp_install_local_aap_ogs | length > 0) or (aap_ocp_install_local_aap_subs | length > 0)

- name: detect-existing-operator | Fail when requested version differs from the cluster-scoped operator
  ansible.builtin.fail:
    msg: >-
      A cluster-scoped AAP operator already exists in
      {{ aap_ocp_install_existing_operator_namespace }}
      (channel {{ aap_ocp_install_existing_operator_channel }}).
      Installing {{ aap_ocp_install_requested_aap_version }} in
      {{ aap_ocp_install_namespace }} would create another OperatorGroup for
      the same APIs (InterOperatorGroupOwnerConflict) or change the existing
      operator. Keep the existing AAP intact. To add another instance, reuse
      the existing operator (AAP
      {{ aap_ocp_install_existing_aap_version }}) in a different namespace.
      To install {{ aap_ocp_install_requested_aap_version }}, use a cluster
      that does not already have a cluster-scoped AAP operator.
  when:
    - aap_ocp_install_foreign_cluster_scoped | bool
    - aap_ocp_install_existing_aap_version | default('') | length > 0
    - aap_ocp_install_requested_aap_version | default('') | length > 0
    - aap_ocp_install_existing_aap_version != aap_ocp_install_requested_aap_version

- name: detect-existing-operator | Reuse existing cluster-scoped operator
  ansible.builtin.set_fact:
    aap_ocp_install_reuse_existing_operator: true
    operatorgroup_create: false
  when:
    - aap_ocp_install_foreign_cluster_scoped | bool
    - aap_ocp_install_local_aap_ogs | length == 0
    - aap_ocp_install_local_aap_subs | length == 0
    - aap_ocp_install_existing_aap_version | default('') | length > 0
    - aap_ocp_install_existing_aap_version == aap_ocp_install_requested_aap_version

- name: detect-existing-operator | Use a namespaced channel when another namespaced operator exists
  ansible.builtin.set_fact:
    aap_ocp_install_operator: >-
      {{
        aap_ocp_install_operator
        | combine(
          {
            'channel': (
              aap_ocp_install_operator.channel
              | regex_replace('-cluster-scoped$', '')
            )
          },
          recursive=true
        )
      }}
  when:
    - not (aap_ocp_install_foreign_cluster_scoped | bool)
    - aap_ocp_install_foreign_aap_subs | length > 0
    - aap_ocp_install_operator.channel | default('') is search('cluster-scoped')

- name: detect-existing-operator | Report operator reuse
  ansible.builtin.debug:
    msg: >-
      Reusing existing AAP operator in
      {{ aap_ocp_install_existing_operator_namespace }}
      (channel {{ aap_ocp_install_existing_operator_channel }}).
      Skipping OperatorGroup/Subscription in
      {{ aap_ocp_install_namespace }} so the existing install is not broken.
  when: aap_ocp_install_reuse_existing_operator | default(false) | bool
# yamllint enable rule:line-length
